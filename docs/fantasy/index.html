<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Фэнтези</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #fff);
      --text: var(--tg-theme-text-color, #000);
      --hint: var(--tg-theme-hint-color, #999);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #fff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Снизу оставляем место под плашку сохранения (#saveBar) и под «безопасную
       зону» айфона (полоска home indicator). Иначе плашка налезает на
       последние карточки и обрезает их. */
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 16px;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
    header { padding: 14px 16px 6px; }
    h1 { font-size: 18px; margin: 0 0 2px; }
    .sub { color: var(--hint); font-size: 13px; }
    .tabs { display: flex; gap: 8px; padding: 8px 16px; }
    .tab { flex: 1; text-align: center; padding: 9px; border-radius: 10px;
      background: var(--secondary-bg); color: var(--text); font-weight: 600;
      cursor: pointer; border: none; font-size: 15px; }
    .tab.active { background: var(--button); color: var(--button-text); }
    .bar { display: flex; align-items: center; gap: 10px; padding: 4px 16px 8px;
      flex-wrap: wrap; row-gap: 6px; }
    /* В админке рядов кнопок много и подписи турниров длинные — без
       переноса они уезжали за край экрана и были недоступны. */
    #adminBody .bar { flex-wrap: wrap; }
    /* Категорий пять, и в один ряд они не влезали — уезжали за край экрана.
       Тот же перенос нужен ряду фильтров: рангов столько же. */
    #catBar, #filterBar { flex-wrap: wrap; row-gap: 6px; }
    #filterBar .chip.on { background: var(--button); color: var(--button-text); }
    /* В бюджетном режиме в кружке слева стоит ЦЕНА (по ней и собирают состав),
       а игровой номер уходит к фамилии — он там нужен для узнавания. */
    .num.cost { font-variant-numeric: tabular-nums; }
    .jersey { color: var(--hint); font-weight: 700; }
    #adminBody .chip { white-space: normal; text-align: left; }
    /* Список игроков в админке — свёрнутый, иначе карточка лиги разъезжается. */
    .adm-players { margin: 6px 0; }
    .adm-players > summary { cursor: pointer; font-size: 13px; padding: 6px 0; color: var(--hint); }
    .adm-players .card { padding: 6px 8px; }
    .plinks a { color: var(--button); text-decoration: none; }
    /* Значок карточки игрока рядом с именем + цена в строке статистики. */
    .tier { margin-right: 4px; }
    .price { color: var(--text); }
    .tier-elite { filter: drop-shadow(0 0 3px #ff9d3d); }
    .tier-plat  { filter: drop-shadow(0 0 2px #7fd3ff); }
    .tier-gold  { filter: drop-shadow(0 0 2px #ffd76a); }
    /* Строка участника раскрывается в состав, которым он играл. Маркер прячем:
       с ним summary ломает flex-раскладку строки. */
    .guess > summary { list-style: none; cursor: pointer; }
    .guess > summary::-webkit-details-marker { display: none; }
    .guess-body { margin: -2px 12px 8px; padding: 8px 12px; border-radius: 10px;
      background: var(--secondary-bg); }
    .guess-body .pstat + .pstat { margin-top: 8px; }
    #newSeason { flex-wrap: wrap; }
    #seasonName { flex: 1; min-width: 160px; background: var(--secondary-bg); color: var(--text);
      border: none; border-radius: 10px; padding: 9px 12px; font-size: 15px;
      font-family: inherit; -webkit-appearance: none; }
    .note { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; font-size: 13px;
      line-height: 1.35; background: var(--secondary-bg); color: var(--hint); }
    /* Счётчик с бюджетом длинный: без запрета переноса он сжимался в столбик
       из одиночных слов, лишь бы уместиться рядом с кнопкой и сортировкой. */
    .counter { color: var(--hint); font-size: 14px; flex: 1; white-space: nowrap; }
    select { background: var(--secondary-bg); color: var(--text); border: none;
      border-radius: 8px; padding: 7px 8px; font-size: 14px; font-family: inherit; }
    #search { flex: 1; background: var(--secondary-bg); color: var(--text); border: none;
      border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; -webkit-appearance: none; }
    .chip { background: var(--secondary-bg); color: var(--hint); border: none;
      border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap; }
    .chip.on { background: var(--button); color: var(--button-text); }
    /* Четыре периода в один ряд не влезают на узком экране — даём горизонтальную
       прокрутку вместо переноса, чтобы ряд читался как переключатель. */
    #topPeriods { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .list { padding: 0 12px; }
    .card { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--secondary-bg); border-radius: 12px; margin: 8px 0;
      cursor: pointer; border: 2px solid transparent; }
    .card.sel { border-color: var(--button); }
    .card.disabled { opacity: .45; }
    .num { min-width: 34px; height: 34px; border-radius: 8px; background: var(--bg);
      display: flex; align-items: center; justify-content: center; font-weight: 700;
      color: var(--hint); flex-shrink: 0; }
    .card.sel .num { background: var(--button); color: var(--button-text); }
    .info { flex: 1; min-width: 0; }
    /* Обрезаться должна ТОЛЬКО фамилия: номер и значок ранга — короткие и
       нужны целиком, иначе «Шлепикас Роман (7)» превращался в «Шлепикас Р…». */
    .pname { font-weight: 600; display: flex; align-items: baseline; gap: 4px;
      min-width: 0; }
    .pname .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pname .tier, .pname .jersey, .pname .chev { flex-shrink: 0; margin-right: 0; }
    .pstat { color: var(--hint); font-size: 12px; margin-top: 2px; }
    .ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .step { width: 30px; height: 30px; border-radius: 8px; border: none; font-size: 18px;
      font-weight: 700; line-height: 1; background: var(--bg); color: var(--button);
      cursor: pointer; padding: 0; }
    .step:disabled { opacity: .3; cursor: default; }
    .step.wide { width: auto; padding: 0 12px; font-size: 14px; }
    .step.del { color: var(--hint); font-size: 15px; }
    .cnt { min-width: 22px; text-align: center; font-weight: 700; }
    .cnt.zero { color: var(--hint); font-weight: 400; }
    .banner { margin: 10px 16px; padding: 12px; border-radius: 10px;
      background: var(--secondary-bg); color: var(--hint); font-size: 14px; text-align: center; }
    .rank { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: var(--secondary-bg); border-radius: 12px; margin: 8px 0; }
    .place { min-width: 30px; font-weight: 700; color: var(--hint); }
    .pts { font-weight: 700; }
    /* Кнопку сохранения рисуем сами, а не нативной MainButton телеграма: та
       живёт в оболочке клиента и на айфоне уезжает за нижний край экрана.
       Своя плашка — часть страницы, её видно всегда. Отступ снизу учитывает
       «безопасную зону» (полоска home indicator). */
    #saveBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg); border-top: 1px solid var(--secondary-bg); }
    #saveBtn { width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--button); color: var(--button-text); font-size: 16px;
      font-weight: 600; font-family: inherit; cursor: pointer; }
    #saveBtn:disabled { opacity: .6; cursor: default; }
    .hidden { display: none; }
    /* pre-line — чтобы в сообщениях работали переносы строк. */
    #msg { text-align: center; color: var(--hint); padding: 40px 16px; white-space: pre-line; }
    .info { cursor: pointer; }
    .chev { color: var(--hint); font-size: 12px; margin-left: 4px; }
    /* Экран игрока */
    /* Экран игрока перекрывает всё (inset: 0), поэтому свою «безопасную зону»
       снизу закладывает сам — иначе журнал игр уползает под home indicator. */
    #player { position: fixed; inset: 0; background: var(--bg); overflow-y: auto;
      padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
    .phead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px; }
    .back { background: none; border: none; color: var(--button); font-size: 16px;
      cursor: pointer; padding: 4px 0; }
    .ptitle { font-size: 19px; font-weight: 700; }
    .warn { margin: 10px 16px; padding: 10px 12px; border-radius: 10px;
      background: var(--secondary-bg); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px; }
    .stat { background: var(--secondary-bg); border-radius: 12px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 19px; }
    .stat span { color: var(--hint); font-size: 12px; }
    .sect { padding: 14px 16px 6px; font-weight: 600; color: var(--hint); font-size: 13px;
      text-transform: uppercase; letter-spacing: .3px; }
    .row { display: flex; justify-content: space-between; padding: 9px 14px; margin: 6px 12px;
      background: var(--secondary-bg); border-radius: 10px; font-size: 14px; }
    .row .d { color: var(--hint); }
  </style>
</head>
<body>
  <header><h1 id="title">🏀 Фэнтези</h1><div class="sub" id="subtitle"></div></header>
  <div class="bar hidden" id="leagueBar">
    <label class="counter" for="league">Лига:</label>
    <select id="league"></select>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-draft" onclick="showTab('draft')">Состав</button>
    <button class="tab" id="tab-table" onclick="showTab('table')">Таблица</button>
    <button class="tab" id="tab-top" onclick="showTab('top')">🔥 Топ</button>
    <button class="tab" id="tab-rules" onclick="showTab('rules')">📖</button>
    <button class="tab hidden" id="tab-admin" onclick="showTab('admin')">⚙️</button>
  </div>
  <div id="draft">
    <div class="bar hidden" id="modeBar"></div>
    <div class="note hidden" id="modeNote"></div>
    <div class="bar hidden" id="catBar"></div>
    <div class="bar hidden" id="filterBar"></div>
    <div class="bar">
      <input id="search" type="search" placeholder="🔎 Поиск по фамилии" autocomplete="off">
    </div>
    <div class="note hidden" id="carryNote"></div>
    <div class="bar">
      <div class="counter" id="counter"></div>
      <button class="chip" id="playedChip" onclick="togglePlayed()">Только с играми</button>
      <select id="sort" aria-label="Сортировка">
        <option value="fp">Фэнтези-очки</option>
        <option value="fp_avg">Очки за игру</option>
        <option value="games">Игры</option>
        <option value="price">Стоимость</option>
        <option value="pts">Очки</option>
        <option value="reb">Подборы</option>
        <option value="ast">Передачи</option>
        <option value="stl">Перехваты</option>
        <option value="blk">Блоки</option>
        <option value="name">Имя</option>
      </select>
    </div>
    <div id="lockBanner" class="banner hidden">🔒 Идёт игра — состав заморожен. Менять можно будет сразу после результата.</div>
    <div class="list" id="pool"></div>
    <div id="poolEmpty" class="banner hidden">Никого не нашлось по фильтру.</div>
  </div>
  <div id="table" class="hidden">
    <div class="bar hidden" id="tableModes"></div>
    <div class="bar"><div class="counter" id="weekLabel"></div></div>
    <div class="list" id="standings"></div>
  </div>
  <div id="top" class="hidden">
    <div class="bar" id="topPeriods">
      <button class="chip on" data-period="last" onclick="showTop('last')">Последняя игра</button>
      <button class="chip" data-period="week" onclick="showTop('week')">Неделя</button>
      <button class="chip" data-period="month" onclick="showTop('month')">Месяц</button>
      <button class="chip" data-period="all" onclick="showTop('all')">Всё время</button>
    </div>
    <div class="bar"><div class="counter" id="topLabel"></div></div>
    <div class="tabs">
      <button class="tab active" id="ttab-players" onclick="showTopTab('players')">🏀 Игроки</button>
      <button class="tab" id="ttab-guess" onclick="showTopTab('guess')">🎯 Участники</button>
    </div>
    <div class="list" id="topList"></div>
    <div class="list hidden" id="guessList"></div>
  </div>
  <div id="rules" class="hidden">
    <div class="list" id="rulesBody"></div>
  </div>
  <div id="player" class="hidden">
    <div class="phead">
      <button class="back" onclick="closePlayer()">‹ Назад</button>
      <div class="ptitle" id="pTitle"></div>
    </div>
    <div class="sub" style="padding: 0 16px 6px" id="pSub"></div>
    <div class="tabs">
      <button class="tab active" id="ptab-last" onclick="showSlice('last')">Последняя игра</button>
      <button class="tab" id="ptab-season" onclick="showSlice('season')">Весь турнир</button>
    </div>
    <div id="pBody"></div>
  </div>

  <div id="admin" class="hidden">
    <div class="bar"><div class="counter">Настройки лиг. Правки применяются сразу.</div></div>
    <div id="adminBody"></div>
  </div>

  <div id="saveBar" class="hidden">
    <button id="saveBtn" onclick="saveRoster()">Сохранить состав</button>
  </div>

  <div id="msg">Загрузка…</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Живой бэкенд: адрес может прийти в ссылке (?api=… — Cloudflare quick-tunnel,
  // он меняется при каждом рестарте), запасной — Tailscale Funnel. Пробуем их
  // ПО ОЧЕРЕДИ: ссылку Telegram кеширует (кнопка меню, старая reply-кнопка), так
  // что адрес в ней легко оказывается мёртвым, и упираться в него, имея рабочий
  // Funnel, нельзя. Если сервер ОТВЕТИЛ (пусть отказом) — перебор прекращаем:
  // адреса ведут к одному серверу, его решение от смены адреса не изменится.
  // Не достучались никуда — приложение уйдёт в запасной режим по #d=.
  const FUNNEL = 'https://botpc.tail5ed4ef.ts.net';
  const API_LIST = [...new Set([
    (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, ''),
    FUNNEL,
  ])].filter(Boolean);
  let API = API_LIST[0] || '';

  let live = false, rosterSize = 3, maxPer = 3, locked = false, inherited = false;
  let seasonInfo = null;          // сезон целиком — правила берут веса отсюда
  // Режим сбора состава. Их может быть включено несколько (админка), тогда
  // человек выбирает перед игрой; при одном включённом переключатель скрыт.
  let modes = [], mode = 'free', catPick = {}, activeCat = null;
  let pool = [], counts = {}, standings = [], weekStart = '';
  // tables — по таблице на режим (живой вход). Запасной отдаёт одну: класть в
  // кнопку три таблицы — снова упереться в лимит длины клавиатуры.
  let tables = {}, myMode = '';
  let search = '', playedOnly = false, isAdmin = false;
  let seasonId = null, seasons = [];

  const $ = id => document.getElementById(id);
  function msg(t){ const m=$('msg'); m.textContent=t; m.classList.toggle('hidden', !t); }

  // Тупиковый экран: кроме сообщения показывать нечего. Вкладки и фильтры
  // прячем — рабочий вид приложения над текстом ошибки только сбивает с толку.
  function deadEnd(text) {
    for (const el of [$('leagueBar'), document.querySelector('.tabs'),
                      $('draft'), $('table'), $('top'), $('admin'), $('saveBar')]) {
      if (el) el.classList.add('hidden');
    }
    msg(text);
  }

  // Отказ в доступе объясняем с ником, который видит бот: причина почти всегда
  // в том, что он не совпадает с ником в таблице команды, и увидеть свой ник
  // прямо в сообщении быстрее, чем выяснять это перепиской с админом.
  function deniedText() {
    let u = '';
    try { u = tg.initDataUnsafe.user.username || ''; } catch (e) {}
    return '🚫 У тебя нет доступа к фэнтези.\n\n' +
      'Она открыта только игрокам команды из состава.\n\n' +
      (u ? `Бот видит тебя как @${u}.\n\n` : '') +
      'Если ты в составе — попроси администратора сверить твой ник в таблице команды.';
  }
  function haptic(t){ try{ tg.HapticFeedback.impactOccurred(t); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const total = () => Object.values(counts).reduce((a,b)=>a+b, 0);

  // ─── источники данных ──────────────────────────────────────────────────────

  // Быстрая проверка достижимости: без неё недоступный бэкенд заставлял ждать
  // полный таймаут, а причину («не доходит» или «отвечает, но отказывает»)
  // было не отличить.
  // Намеренно без заголовка X-Init-Data: это «простой» запрос, браузер не шлёт
  // предзапрос. Провал здесь означает именно сеть или DNS, а не CORS.
  async function reachable() {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 5000);
    try { await fetch(API + '/health', {signal: ctl.signal}); return true; }
    catch (e) { return false; }
    finally { clearTimeout(timer); }
  }

  async function api(path, opts, timeoutMs) {
    // Выбранную лигу подмешиваем во ВСЕ вызовы — бэкенд считает по ней.
    if (seasonId) path += (path.indexOf('?') >= 0 ? '&' : '?') + 'season=' + encodeURIComponent(seasonId);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs || 15000);  // мобильная сеть бывает медленной
    try {
      const r = await fetch(API + path, Object.assign({
        signal: ctl.signal,
        headers: Object.assign({'X-Init-Data': (tg && tg.initData) || ''},
                               (opts && opts.body) ? {'Content-Type':'application/json'} : {}),
      }, opts || {}));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { const e = new Error('HTTP ' + r.status); e.data = data; throw e; }
      return data;
    } finally { clearTimeout(timer); }
  }

  // Запасной режим: бот кладёт данные в URL — #d=base64url(JSON).
  function readHashData() {
    const m = (location.hash || '').match(/[#&]d=([^&]+)/);
    if (!m) return null;
    try {
      let b = m[1].replace(/-/g,'+').replace(/_/g,'/');
      while (b.length % 4) b += '=';
      const bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (e) { return null; }
  }

  const ZERO = {games:0,pts:0,reb:0,ast:0,stl:0,blk:0,tur:0,fp:0,fp_avg:0};

  // Приводим оба формата к одному виду. В запасном режиме ключи сокращены,
  // чтобы URL Mini App не разрастался.
  function fromHash(D) {
    seasonInfo = D.season;
    rosterSize = D.season.roster_size || 3;
    maxPer = D.season.max_per_player || rosterSize;
    locked = !!D.locked;
    weekStart = D.week_start || '';
    standings = D.standings || [];
    pool = (D.pool || []).map(p => {
      const s = p.s || {};
      return { ref: p.r, name: p.m || p.r, number: p.n || '', team: '',
        price: p.c || 0, tier: p.t || '',
        st: {games:s.g||0, pts:s.p||0, reb:s.rb||0, ast:s.a||0,
             stl:s.s||0, blk:s.b||0, tur:s.t||0, fp:s.f||0,
             fp_avg: s.g ? Math.round((s.f||0)/s.g*10)/10 : 0},
        last: {fp: s.lf, date: s.ld} };
    });
    for (const r of (D.roster || [])) counts[r] = (counts[r] || 0) + 1;
    inherited = !!D.inherited;
    setModes(D.season.modes, D.mode, D.cats);
    $('subtitle').textContent = D.season.name + ' · формат ' + D.season.format;
  }

  async function fromApi() {
    const [p, r, s] = await Promise.all([
      api('/fantasy/pool'), api('/fantasy/roster'), api('/fantasy/standings'),
    ]);
    if (!p.season) { msg('Сейчас нет активного сезона фэнтези.'); return false; }
    if (!p.member) { msg('Фэнтези доступна только игрокам команды.'); return false; }
    seasons = p.seasons || [];
    if (!seasonId) seasonId = p.season.id;   // первый ответ фиксирует лигу
    renderLeaguePicker();
    seasonInfo = p.season;
    rosterSize = p.season.roster_size || 3;
    maxPer = p.season.max_per_player || rosterSize;
    isAdmin = !!p.admin;
    locked = !!r.locked;
    weekStart = r.week_start || s.week_start || '';
    standings = s.standings || [];
    tables = s.tables || {};
    myMode = s.my_mode || '';
    pool = (p.pool || []).map(x => ({
      ref: x.ref, name: x.name || x.ref, number: x.number || '', team: x.team || '',
      price: x.price || 0, tier: x.tier || '',
      st: Object.assign({}, ZERO, x.stats || {}),
      last: {fp: (x.last||{}).fp, date: (x.last||{}).date},
      excluded: !!x.excluded,
    }));
    for (const ref of (r.roster || [])) counts[ref] = (counts[ref] || 0) + 1;
    inherited = !!r.inherited;
    setModes(p.season.modes, r.mode, r.cats);
    $('subtitle').textContent = p.season.name + ' · формат ' + p.season.format;
    return true;
  }

  // ─── отрисовка ─────────────────────────────────────────────────────────────

  function sortPool() {
    const key = $('sort').value;
    // Цена живёт на самом игроке, а не в его статистике: сортировать по ней
    // надо отдельной веткой, иначе список молча не менял порядок.
    const val = p => key === 'price' ? (p.price || 0) : (p.st[key] || 0);
    pool.sort((a, b) => key === 'name'
      ? a.name.localeCompare(b.name, 'ru')
      : val(b) - val(a) || a.name.localeCompare(b.name, 'ru'));
  }

  // Под фамилией — очки за последнюю игру + подсказка тапнуть за подробностями.
  function statLine(p) {
    if (!p.st.games) return 'нет сыгранных игр';
    const lf = p.last && p.last.fp;
    const head = (lf === null || lf === undefined)
      ? `${p.st.games} игр · ${p.st.fp} FP`
      : `Посл. игра: ${lf} FP`;
    return live ? `${head} · нажми для деталей ›` : head;
  }

  // Карточка игрока: платина/золото/серебро/бронза — по стоимости из таблицы.
  // Цену ведёт тренер, поэтому значок обязан браться из данных, а не считаться
  // на фронте: иначе после ручной правки он разойдётся с ценой.
  const TIER_ICON = {'Элита': '👑', 'Платина': '💎', 'Золото': '🥇',
                     'Серебро': '🥈', 'Бронза': '🥉'};
  const TIER_KEY = {'Элита': 'elite', 'Платина': 'plat', 'Золото': 'gold',
                    'Серебро': 'silver', 'Бронза': 'bronze'};

  function tierBadge(p) {
    const icon = TIER_ICON[p.tier];
    return icon ? `<span class="tier tier-${TIER_KEY[p.tier] || ''}" title="${esc(p.tier)}">${icon}</span>` : '';
  }

  function priceLabel(p) {
    return p.price ? `<b class="price">${p.price}</b> · ` : '';
  }

  function passesFilter(p) {
    // Убранные админом не показываются никому: вернуть их можно на вкладке ⚙️,
    // а в общем списке они только мешали выбирать состав.
    if (p.excluded) return false;
    // Выбранных всегда показываем, чтобы не терять свой состав из виду.
    if (counts[p.ref]) return true;
    if (search && p.name.toLowerCase().indexOf(search) < 0) return false;
    if (playedOnly && !(p.st && p.st.games)) return false;
    if (tierFilter.size && !tierFilter.has(p.tier)) return false;
    if (affordable && (p.price || 0) > budget() - spent()) return false;
    return true;
  }

  // Ранг — это и есть ценовая полоса (бронза 5–14, серебро 15–29 и так далее),
  // поэтому фильтр один: чип показывает и ранг, и диапазон. Отдельный список
  // «ценовых диапазонов» дублировал бы эти же границы.
  let tierFilter = new Set(), affordable = false;

  function rankBands() {
    const info = (seasonInfo && seasonInfo.ranks && seasonInfo.ranks.ranks) || [];
    if (info.length) return info.map(r => ({rank: r.rank, low: r.low, high: r.high}));
    // Запасной вход (данные приехали в кнопке, а не из API) — полос не знаем,
    // собираем список из того, что есть у игроков в пуле.
    const seen = [];
    for (const k of Object.keys(TIER_ICON)) if (pool.some(p => p.tier === k)) seen.push({rank: k});
    return seen;
  }

  function renderFilterBar() {
    const bar = $('filterBar');
    const on = mode === 'budget';
    bar.classList.toggle('hidden', !on);
    if (!on) { tierFilter.clear(); affordable = false; return; }
    const left = budget() - spent();
    bar.innerHTML = rankBands().map(b => {
      const band = b.low ? ` ${b.low}–${b.high}` : '';
      return `<button class="chip${tierFilter.has(b.rank) ? ' on' : ''}" ` +
        `onclick="toggleTier(${jattr(b.rank)})">${TIER_ICON[b.rank] || ''}${band}</button>`;
    }).join('') +
      `<button class="chip${affordable ? ' on' : ''}" onclick="toggleAffordable()">` +
      `💰 по карману (${left >= 0 ? left : 'перебор'})</button>`;
  }

  function toggleTier(rank) {
    haptic('light');
    tierFilter.has(rank) ? tierFilter.delete(rank) : tierFilter.add(rank);
    renderFilterBar(); renderPool();
  }
  window.toggleTier = toggleTier;

  function toggleAffordable() {
    haptic('light');
    affordable = !affordable;
    renderFilterBar(); renderPool();
  }
  window.toggleAffordable = toggleAffordable;

  function renderPool() {
    sortPool();
    renderFilterBar();
    const el = $('pool'); el.innerHTML = '';
    const full = total() >= rosterSize;
    const visible = pool.filter(passesFilter);
    $('poolEmpty').classList.toggle('hidden', visible.length > 0);
    for (const p of visible) {
      const n = counts[p.ref] || 0;
      const canAdd = !locked && !full && n < maxPer;
      const c = document.createElement('div');
      c.className = 'card' + (n ? ' sel' : '') + ((locked || (!n && full)) ? ' disabled' : '');
      const ctrl =
        `<button class="step" data-act="dec" ${(!n || locked) ? 'disabled' : ''}>−</button>` +
        `<span class="cnt${n ? '' : ' zero'}">${n}</span>` +
        `<button class="step" data-act="inc" ${canAdd ? '' : 'disabled'}>+</button>`;
      const costMode = mode === 'budget';
      const badge = costMode
        ? `<div class="num cost" title="стоимость">${p.price || '—'}</div>`
        : `<div class="num">${esc(p.number || '—')}</div>`;
      // Номер — во ВТОРУЮ строку: в первой он отъедал место у фамилии, и
      // длинные превращались в «Шлепикас Р…». Цена в бюджете уже в кружке,
      // поэтому в строке статистики её не дублируем.
      const jersey = costMode && p.number ? `<b class="jersey">№${esc(p.number)}</b> · ` : '';
      c.innerHTML = badge +
        `<div class="info"><div class="pname">${tierBadge(p)}` +
        `<span class="nm">${esc(p.name)}</span>` +
        (live ? '<span class="chev">›</span>' : '') + `</div>` +
        `<div class="pstat">${jersey}${costMode ? '' : priceLabel(p)}` +
        `${esc(statLine(p))}</div></div>` +
        `<div class="ctrl">${ctrl}</div>`;
      const inc = c.querySelector('[data-act=inc]'); if (inc) inc.onclick = e => { e.stopPropagation(); bump(p.ref, +1); };
      const dec = c.querySelector('[data-act=dec]'); if (dec) dec.onclick = e => { e.stopPropagation(); bump(p.ref, -1); };
      c.querySelector('.info').onclick = () => openPlayer(p.ref);
      el.appendChild(c);
    }
    updateCounter();
  }

  // ─── режимы сбора состава ──────────────────────────────────────────────────

  function modeCfg(id) { return (modes || []).find(m => m.id === (id || mode)) || {}; }
  const budget = () => modeCfg('budget').budget || 100;
  const spent = () => selectedRefs().reduce((a, r) => a + (byRef(r).price || 0), 0);
  const byRef = ref => pool.find(p => p.ref === ref) || {};

  function setModes(list, current, cats) {
    modes = list || [];
    const ids = modes.map(m => m.id);
    mode = ids.includes(current) ? current : (ids[0] || 'free');
    // Режим сохранённого состава: играть можно только в одном, поэтому надо
    // помнить, откуда человек уходит, если начал собирать в другом.
    savedMode = ids.includes(current) ? current : '';
    savedCount = Object.keys(counts).length;
    catPick = {};
    const slots = (modeCfg('category').categories || []).map(c => c.id);
    (cats || []).forEach((c, i) => {
      const refs = selectedRefs();
      if (slots.includes(c) && refs[i]) catPick[c] = refs[i];
    });
    activeCat = slots.find(c => !catPick[c]) || slots[0] || null;
    renderModeBar();
  }

  let savedMode = '', savedCount = 0;

  const modeTitle = id => (modes.find(m => m.id === id) || {}).title || id;

  // Предупреждаем ЗАРАНЕЕ, а не только в момент сохранения: человек должен
  // понимать, что собирает второй состав ВЗАМЕН первого, а не вдобавок.
  function renderModeNote() {
    const el = $('modeNote');
    const switching = savedCount && savedMode && savedMode !== mode;
    el.textContent = switching
      ? `⚠️ У тебя уже собран состав в режиме «${modeTitle(savedMode)}». Играть ` +
        'можно только в одном: сохранишь этот — прежний сбросится.'
      : '';
    el.classList.toggle('hidden', !switching);
  }

  function renderModeBar() {
    const bar = $('modeBar');
    bar.classList.toggle('hidden', (modes || []).length < 2);
    bar.innerHTML = (modes || []).map(m =>
      `<button class="chip${m.id === mode ? ' on' : ''}" onclick="pickMode('${m.id}')">` +
      `${esc(m.title)}</button>`).join('');
    renderModeNote();
    renderCatBar();
  }

  function pickMode(id) {
    if (id === mode) return;
    haptic('light');
    mode = id;
    counts = {}; catPick = {};      // правила разные — состав собирается заново
    inherited = false;              // и перенесённым он больше не считается
    const slots = (modeCfg('category').categories || []).map(c => c.id);
    activeCat = slots[0] || null;
    tierFilter.clear(); affordable = false;
    renderModeBar(); renderPool(); syncButton();
  }
  window.pickMode = pickMode;

  // В категорийном режиме место в составе — это категория: выбираешь слот,
  // потом игрока. Так виднее, за что он будет приносить очки.
  function renderCatBar() {
    const bar = $('catBar');
    const cats = modeCfg('category').categories || [];
    const on = mode === 'category' && cats.length;
    bar.classList.toggle('hidden', !on);
    if (!on) return;
    bar.innerHTML = cats.map(c => {
      const who = catPick[c.id] ? byRef(catPick[c.id]).name || '' : '';
      const label = who ? `${esc(c.title)}: ${esc(who.split(' ')[0])}` : esc(c.title);
      return `<button class="chip${c.id === activeCat ? ' on' : ''}" ` +
             `onclick="pickCat('${c.id}')">${label}</button>`;
    }).join('');
  }

  function pickCat(id) {
    haptic('light');
    if (activeCat === id && catPick[id]) {        // повторное нажатие — очистить
      delete counts[catPick[id]];
      delete catPick[id];
    }
    activeCat = id;
    renderModeBar(); renderPool(); syncButton();
  }
  window.pickCat = pickCat;

  function assignCategory(ref) {
    const cats = (modeCfg('category').categories || []).map(c => c.id);
    if (!cats.length) return;
    // Один игрок — одна категория: если он уже где-то стоит, снимаем оттуда.
    for (const c of cats) if (catPick[c] === ref) { delete catPick[c]; delete counts[ref]; }
    const slot = activeCat && !catPick[activeCat] ? activeCat : cats.find(c => !catPick[c]);
    if (!slot) return;
    catPick[slot] = ref;
    counts[ref] = 1;
    activeCat = cats.find(c => !catPick[c]) || slot;
    haptic('medium');
    renderModeBar(); renderPool(); syncButton();
  }

  function bump(ref, delta) {
    if (mode === 'category') {                    // тут плюс/минус не по числу
      if (locked) return;
      if (delta > 0) assignCategory(ref);
      else {
        for (const c of Object.keys(catPick)) if (catPick[c] === ref) delete catPick[c];
        delete counts[ref];
        renderModeBar(); renderPool(); syncButton();
      }
      return;
    }
    const n = counts[ref] || 0;
    if (delta > 0) {
      if (locked || total() >= rosterSize || n >= maxPer) return;
      counts[ref] = n + 1; haptic('medium');
    } else {
      if (locked || !n) return;
      if (n === 1) delete counts[ref]; else counts[ref] = n - 1;
      haptic('light');
    }
    renderPool(); syncButton();
  }

  function slots() {
    const cats = modeCfg('category').categories || [];
    return mode === 'category' && cats.length ? cats.length : rosterSize;
  }

  function updateCounter() {
    let hint = maxPer < rosterSize ? ` · до ${maxPer} на игрока` : '';
    if (mode === 'budget') {
      const left = budget() - spent();
      hint = ` · бюджет ${spent()}/${budget()}` + (left < 0 ? ' — перебор!' : '');
    } else if (mode === 'category') {
      hint = ' · по игроку на категорию';
    }
    $('counter').textContent = `Выбрано: ${total()} / ${slots()}${hint}`;
    // Состав живёт, пока его не поменяли: человек должен видеть, что этот
    // набор перенесён с прошлой игры и уже играет — заново собирать не нужно.
    //
    // Цены двигаются после каждой игры, поэтому перенесённый состав может стать
    // дороже бюджета. Задним числом мы его не ломаем: он уже сыгран этим
    // набором и продолжает играть. Бюджет проверяется в момент СОХРАНЕНИЯ —
    // значит подорожание бьёт только по следующей пересборке.
    const note = $('carryNote');
    const pricey = inherited && mode === 'budget' && spent() > budget();
    note.textContent = pricey
      ? `💹 Твои игроки подорожали (${spent()} из ${budget()}). Состав играет ` +
        'как есть — но чтобы собрать новый, надо будет уложиться в бюджет.'
      : (inherited
          ? '↩️ Состав перенесён с прошлой игры — он играет и дальше, пока ты его не поменяешь.'
          : '');
    note.classList.toggle('hidden', !note.textContent);
  }

  // Плашку показываем только на вкладке состава и только когда набран полный
  // ростер — на «Таблице» и на экране игрока сохранять нечего.
  function syncButton() {
    const onDraft = !$('draft').classList.contains('hidden');
    const overBudget = mode === 'budget' && spent() > budget();
    const ready = onDraft && !locked && total() === slots() && !overBudget;
    $('saveBar').classList.toggle('hidden', !ready);
  }

  // Состав как плоский список с повторами — порядок пула, чтобы был стабилен.
  function selectedRefs() {
    const out = [];
    for (const p of pool) for (let i = 0; i < (counts[p.ref] || 0); i++) out.push(p.ref);
    return out;
  }

  const SAVE_ERRORS = {
    invalid_roster: 'Неверное число игроков.',
    over_budget: 'Состав дороже бюджета — замени кого-то на подешевле.',
    no_price: 'У кого-то из выбранных нет цены — напиши админу.',
    bad_categories: 'Нужно закрыть каждую категорию.',
    duplicate_player: 'Один игрок может занимать только одну категорию.',
    unknown_player: 'В составе есть игрок не из пула.',
    too_many_copies: 'Слишком много копий одного игрока.',
    locked: 'Идёт игра — состав заморожен. Менять можно будет сразу после результата.',
    not_a_member: 'У тебя нет доступа к фэнтези — она только для игроков команды.',
  };

  function confirmModeSwitch() {
    const text = 'Играть можно только в одном режиме. Состав в режиме ' +
      `«${modeTitle(savedMode)}» сбросится, в зачёт пойдёт новый.`;
    return new Promise(resolve => {
      if (tg && tg.showPopup) {
        tg.showPopup({title: 'Сменить режим?', message: text.slice(0, 250),
                      buttons: [{id: 'ok', type: 'destructive', text: 'Сохранить'},
                                {id: 'no', type: 'cancel'}]},
                     id => resolve(id === 'ok'));
      } else if (tg && tg.showConfirm) {
        tg.showConfirm(text, ok => resolve(!!ok));
      } else {
        resolve(window.confirm(text));
      }
    });
  }

  async function saveRoster() {
    haptic('heavy');
    if (savedCount && savedMode && savedMode !== mode) {
      if (!await confirmModeSwitch()) return;
    }
    const refs = mode === 'category'
      ? (modeCfg('category').categories || []).map(c => catPick[c.id])
      : selectedRefs();
    const cats = mode === 'category'
      ? (modeCfg('category').categories || []).map(c => c.id) : [];
    if (!live) { tg.sendData(JSON.stringify({ refs, mode, cats })); return; }  // Telegram закроет
    const btn = $('saveBtn');
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    try {
      await api('/fantasy/roster', { method: 'POST', body: JSON.stringify({ refs, mode, cats }) });
      inherited = false;
      savedMode = mode; savedCount = refs.length; renderModeNote();
      tg.showPopup ? tg.showPopup({title:'Готово', message:'Состав сохранён! Удачи в туре 🏀',
                                   buttons:[{type:'close'}]}, () => tg.close())
                   : tg.close();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Сохранить состав';
      const text = (e.data && SAVE_ERRORS[e.data.error]) || 'Не удалось сохранить. Попробуй ещё раз.';
      tg.showAlert ? tg.showAlert(text) : alert(text);
    }
  }
  window.saveRoster = saveRoster;

  // ─── экран игрока ──────────────────────────────────────────────────────────

  let P = null, slice = 'last';

  async function openPlayer(ref) {
    if (!live) { tg && tg.showAlert ? tg.showAlert('Статистика игрока доступна только при связи с ботом.') : 0; return; }
    haptic('light');
    $('player').classList.remove('hidden');
    $('pTitle').textContent = 'Загрузка…';
    $('pSub').textContent = '';
    $('pBody').innerHTML = '';
    $('saveBar').classList.add('hidden');
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closePlayer); }
    try {
      P = await api('/fantasy/player?ref=' + encodeURIComponent(ref));
    } catch (e) {
      $('pTitle').textContent = 'Не удалось загрузить';
      return;
    }
    slice = 'last';
    renderPlayer();
  }

  function closePlayer() {
    $('player').classList.add('hidden');
    if (tg && tg.BackButton) tg.BackButton.hide();
    syncButton();
  }
  window.closePlayer = closePlayer;

  function showSlice(name) {
    slice = name;
    $('ptab-last').classList.toggle('active', name === 'last');
    $('ptab-season').classList.toggle('active', name === 'season');
    renderPlayer();
  }
  window.showSlice = showSlice;

  function statCard(value, label) {
    return `<div class="stat"><b>${value}</b><span>${label}</span></div>`;
  }

  // «5 игр» / «2 игры» / «1 игра» — иначе текст выглядит машинным.
  function games(n) {
    const t = Math.abs(n) % 100, o = t % 10;
    if (t > 10 && t < 20) return n + ' игр';
    if (o === 1) return n + ' игра';
    if (o >= 2 && o <= 4) return n + ' игры';
    return n + ' игр';
  }

  function renderPlayer() {
    const s = P.season;
    $('pTitle').textContent = (P.number ? '№' + P.number + ' ' : '') + P.name;
    $('pSub').textContent = P.tournament || '';
    const b = $('pBody');

    // Посещаемость и пропуски показываем в обоих срезах: без них непонятно,
    // за сколько матчей набраны очки.
    let html = `<div class="warn">Сыграл <b>${s.games}</b> из ${games(s.team_games)} команды` +
      (s.missed_streak ? ` · пропустил ${games(s.missed_streak)} подряд` : '') + `</div>`;

    if (slice === 'last') {
      const l = P.last;
      if (!l) {
        html += '<div class="banner">В этом турнире ещё не играл</div>';
      } else {
        html += `<div class="sect">${l.game_date} · ${l.home ? 'дома' : 'в гостях'} с ` +
          `${esc(l.opponent || 'соперником')} · ${l.our_score}:${l.their_score}</div>` +
          '<div class="grid">' +
          statCard(l.fp, 'фэнтези-очки') + statCard(l.pts, 'очки') + statCard(l.reb, 'подборы') +
          statCard(l.ast, 'передачи') + statCard(l.stl, 'перехваты') + statCard(l.blk, 'блоки') +
          statCard(l.tur, 'потери') + statCard(l.fgm + '/' + l.fga, 'броски') +
          statCard(l.tpm + '/' + l.tpa, 'трёхочковые') +
          '</div>';
      }
    } else {
      const a = s.avg, pct = v => v === null || v === undefined ? '—' : v + '%';
      html += '<div class="grid">' +
        statCard(s.fp, 'фэнтези-очки') + statCard(s.fp_avg, 'FP за игру') + statCard(s.games, 'сыграно') +
        '</div><div class="sect">В среднем за игру</div><div class="grid">' +
        statCard(a.pts ?? 0, 'очки') + statCard(a.reb ?? 0, 'подборы') + statCard(a.ast ?? 0, 'передачи') +
        statCard(a.stl ?? 0, 'перехваты') + statCard(a.blk ?? 0, 'блоки') + statCard(a.tur ?? 0, 'потери') +
        '</div><div class="sect">Реализация</div><div class="grid">' +
        statCard(pct(s.fg_pct), 'с игры') + statCard(pct(s.tp_pct), 'трёхочковые') +
        statCard(pct(s.ft_pct), 'штрафные') +
        '</div>';
    }

    if (P.log && P.log.length) {
      html += '<div class="sect">Последние игры</div>';
      for (const g of P.log) {
        html += `<div class="row"><span class="d">${g.game_date}</span>` +
          `<span>${g.pts} очк · ${g.reb} подб · ${g.ast} пас</span>` +
          `<b>${g.fp}</b></div>`;
      }
    }
    b.innerHTML = html;
  }

  let openRank = -1;   // раскрытая история участника
  // У каждого режима своя таблица: правила разные, и общий зачёт сравнивал бы
  // несравнимое. Очки остаются в таблице того режима, которым набраны.
  let tableMode = '';

  function renderTableModes() {
    const bar = $('tableModes');
    const ids = Object.keys(tables || {});
    bar.classList.toggle('hidden', ids.length < 2);
    if (ids.length < 2) { tableMode = ids[0] || ''; return; }
    if (!ids.includes(tableMode)) tableMode = myMode && ids.includes(myMode) ? myMode : ids[0];
    bar.innerHTML = ids.map(id =>
      `<button class="chip${id === tableMode ? ' on' : ''}" ` +
      `onclick="pickTableMode(${jattr(id)})">${esc(modeTitle(id))}` +
      `${id === myMode ? ' · ты' : ''}</button>`).join('');
  }

  function pickTableMode(id) {
    haptic('light');
    tableMode = id; openRank = -1;
    renderStandings();
  }
  window.pickTableMode = pickTableMode;

  function renderStandings() {
    renderTableModes();
    const el = $('standings'); el.innerHTML = '';
    const rows = (tables && tables[tableMode]) || standings;
    $('weekLabel').textContent = (tables && Object.keys(tables).length > 1)
      ? `Зачёт режима «${modeTitle(tableMode)}»` : 'Общий зачёт лиги';
    if (!rows.length) { el.innerHTML = '<div class="banner">Пока нет очков</div>'; return; }
    rows.forEach((row, i) => {
      const medal = ['🥇','🥈','🥉'][i] || (i + 1) + '.';
      const div = document.createElement('div'); div.className = 'rank';
      div.innerHTML = `<div class="place">${medal}</div>` +
        `<div class="info"><div class="pname">${esc(row.name || 'Участник')}` +
        ((row.history && row.history.length) ? '<span class="chev">›</span>' : '') + `</div></div>` +
        `<div class="pts">${row.points}</div>`;
      div.onclick = () => { openRank = (openRank === i ? -1 : i); renderStandings(); };
      el.appendChild(div);
      // История по турам — раскрывается под участником.
      if (openRank === i && row.history && row.history.length) {
        for (const h of row.history.slice().reverse()) {
          const hr = document.createElement('div'); hr.className = 'row';
          hr.innerHTML = `<span class="d">${esc(h.label || ('Тур с ' + h.week))}</span><b>${h.points}</b>`;
          el.appendChild(hr);
        }
      }
    });
  }

  function showTab(name) {
    for (const t of ['draft', 'table', 'top', 'rules', 'admin']) {
      $(t).classList.toggle('hidden', name !== t);
      $('tab-' + t).classList.toggle('active', name === t);
    }
    syncButton();
    if (name === 'top' && !$('topList').children.length) showTop(topPeriod);
    if (name === 'admin') loadAdmin();
    if (name === 'rules') renderRules();
  }
  window.showTab = showTab;

  // ─── правила ───────────────────────────────────────────────────────────────
  //
  // Собираются из настроек сезона, а не пишутся текстом: веса очков и размер
  // состава админ меняет на ходу, и правила обязаны меняться вместе с ними —
  // иначе экран начнёт врать в первый же день после правки.

  const WEIGHT_TITLES = {
    pts: 'Очко', reb: 'Подбор', ast: 'Передача', stl: 'Перехват',
    blk: 'Блок-шот', tur: 'Потеря', pf: 'Фол', kpi: 'КПИ',
    miss: 'Промах с игры', ftmiss: 'Промах штрафного',
    dd: 'Дабл-дабл', td: 'Трипл-дабл',
    plus_minus: 'Плюс-минус', mins: 'Минута на площадке',
  };

  function rankRules(r) {
    if (!r || !r.ranks) return '';
    const rows = r.ranks.map(x =>
      `<div class="row"><span>${TIER_ICON[x.rank] || ''} ${esc(x.rank)} · ${x.low}–${x.high}</span>` +
      `<b>${x.up ? '↑ ' + x.up : '—'} / ${x.down ? '↓ ' + x.down : '—'}</b></div>`).join('');
    return ruleCard('📈 Как меняется цена',
      'Цена не стоит на месте: после каждой игры бот смотрит твою форму — ' +
      `сколько фэнтези-очков за игру ты набираешь в среднем.<br><br>` +
      `<b>Подняться в ранг выше:</b> держать «потолок» своего ранга ` +
      `${r.up_games} игр подряд.<br>` +
      `<b>Упасть на ранг ниже:</b> провалиться под «пол» своего ранга ` +
      `${r.down_games} игр подряд.<br>` +
      'Пороги разные: чтобы войти в серебро, нужно 9 очков за игру, а чтобы ' +
      'выпасть из него — провалиться ниже 7. Так игрок на границе не прыгает ' +
      'туда-обратно после каждого матча.<br><br>' +
      `Пока ранг тот же, цена ползёт к уровню формы, но не больше чем на ` +
      `${r.step} за игру и не выходя за полосу ранга. Игр меньше ` +
      `${r.up_games} — цена стоит: двигать не на чем.<br><br>` +
      '<b>Что будет с моим составом?</b> Цены пересчитываются после каждой ' +
      'игры. Если твои игроки подорожали и состав вылез за бюджет — он всё ' +
      'равно играет дальше как есть, очки не отнимаются. Бюджет проверяется ' +
      'только когда ты собираешь состав заново.') +
      `<div class="sect">Пороги: ↑ подъём / ↓ падение (очков за игру)</div>` + rows;
  }

  function ruleCard(title, body) {
    return `<div class="rank" style="display:block">` +
      `<div class="pname">${title}</div><div class="pstat">${body}</div></div>`;
  }

  function renderRules() {
    const el = $('rulesBody');
    const s = seasonInfo || {};
    const size = s.roster_size || rosterSize;
    const per = s.max_per_player || maxPer;
    const w = s.weights || {};
    const keys = Object.keys(w);
    const rows = keys.length
      ? `<div class="sect">Сколько дают действия</div>` + keys.map(k =>
          `<div class="row"><span>${esc(WEIGHT_TITLES[k] || k)}</span>` +
          `<b>${w[k] > 0 ? '+' : ''}${w[k]}</b></div>`).join('') +
        ruleCard('ℹ️ Про брак и дабл-даблы',
          'Промах с игры и промах штрафного считаются из протокола: попытки ' +
          'минус попадания. Так дорогим становится не тот, кто много бросает, ' +
          'а тот, кто попадает.<br><br>' +
          'Дабл-дабл — два показателя из пяти (очки, подборы, передачи, ' +
          'перехваты, блок-шоты) по 10 и больше. Трипл-дабл — три и больше, ' +
          'и он идёт ВМЕСТО дабл-дабла, а не сверх него.')
      : ruleCard('🧾 Начисления',
          'Таблица начислений подгрузится, когда приложение свяжется с ботом. ' +
          'Открой его заново — или нажми /start в чате, чтобы обновить кнопку.');

    const ms = s.modes || [];
    const modeCards = ms.map(m => {
      if (m.id === 'budget') {
        return ruleCard('💰 Режим «Бюджет»',
          `На каждую игру даётся ${m.budget} очков. За них собираешь состав: ` +
          'у каждого игрока своя цена — чем результативнее, тем дороже. Очки ' +
          'начисляются за ВСЕ действия выбранных. Бюджет на следующую игру ' +
          'выдаётся заново и не копится.');
      }
      if (m.id === 'category') {
        const cats = (m.categories || []).map(c => esc(c.title)).join(', ');
        return ruleCard('🎯 Режим «По категориям»',
          `Выбираешь по игроку в каждую категорию: ${cats}. Игрок приносит очки ` +
          `ТОЛЬКО за свою категорию — зато они умножаются на ${m.multiplier}. ` +
          'Остальная его статистика не считается, один человек — одна категория. ' +
          'Бюджет тут не нужен.');
      }
      return ruleCard('🏀 Режим «Свободный»',
        `Состав из ${size} игроков, без бюджета. Одного человека можно взять ` +
        (per >= size ? 'несколько раз' : `до ${per} раз(а)`) +
        ' — тогда его очки за игру засчитаются столько раз, сколько слотов ты ' +
        'ему отдал: два слота — очки идут дважды.');
    }).join('');

    el.innerHTML =
      (ms.length > 1
        ? ruleCard('🎮 Режимы',
            'Перед игрой выбери, как играть — переключатель наверху вкладки ' +
            '«Состав». Играть можно только в ОДНОМ режиме: соберёшь состав в ' +
            'другом — прежний сбросится.<br><br>' +
            'У каждого режима своя таблица, режимы между собой не соревнуются. ' +
            'Правила у них разные, и складывать такие очки в один зачёт было бы ' +
            'нечестно. Уже набранные очки остаются в таблице своего режима.')
        : '') +
      modeCards +
      ruleCard('⏱ Когда меняется',
        'Состав замораживается со стартовым свистком и оттаивает, когда бот ' +
        'пришлёт результат игры в чат. Между играми меняй сколько хочешь.') +
      ruleCard('↩️ Если не поменял',
        'Состав остаётся прежним и играет следующий матч. Забыл — всё равно ' +
        'получишь очки, менять каждую неделю не обязательно.') +
      ruleCard('🧮 Очки',
        'За каждую игру очки считаются по статистике твоих игроков и ' +
        'фиксируются навсегда. Задним числом они не пересчитываются: ' +
        'поменял состав после игры — прошлые очки остаются как были.') +
      rankRules(s.ranks) +
      ruleCard('💎 Карточки и цена',
        'У каждого игрока есть цена — она собрана из его статистики: очки за ' +
        'игру, где текущий сезон весит больше прошлого. Цвет карточки зависит ' +
        'только от цены:<br>' +
        '👑 Элита — 70 и дороже<br>' +
        '💎 Платина — 50–69<br>' +
        '🥇 Золото — 30–49<br>' +
        '🥈 Серебро — 15–29<br>' +
        '🥉 Бронза — до 14<br>' +
        'Цена показана в строке под именем. В режиме «Бюджет» именно её и ' +
        'тратишь; в остальных она просто показывает уровень игрока.') +
      rows +
      ruleCard('📊 Где смотреть',
        'Вкладка «Таблица» — общий зачёт участников. «🔥 Топ» — кто из игроков ' +
        'принёс больше очков и кто из участников лучше угадал, с их составами.') +
      ruleCard('❓ Вопросы',
        'Кнопка «💬 Написать админам» под чатом — предложения и баги туда же.');
  }
  window.renderRules = renderRules;

  // ─── админка ───────────────────────────────────────────────────────────────
  //
  // Каждая лига правится по своему id. Инлайн-кнопки в чате этого не умели: при
  // двух активных лигах правка уходила в последнюю, и админ этого не видел.

  async function loadAdmin() {
    const el = $('adminBody');
    if (!live) { el.innerHTML = '<div class="banner">Админка доступна только при связи с ботом.</div>'; return; }
    el.innerHTML = '<div class="banner">Загрузка…</div>';
    try { renderAdmin(await api('/fantasy/admin')); }
    catch (e) { el.innerHTML = '<div class="banner">Не удалось открыть админку.</div>'; }
  }

  // Какие списки игроков раскрыты и где стояла страница. Ответ сервера
  // перерисовывает всю админку, и без этого после «Убрать» список схлопывался,
  // а экран прыгал наверх — а убирают обычно нескольких подряд.
  const openPlayers = new Set();

  async function adminDo(body) {
    const y = window.scrollY;
    try {
      renderAdmin(await api('/fantasy/admin', {method: 'POST', body: JSON.stringify(body)}));
      window.scrollTo(0, y);
    } catch (e) { tg && tg.showAlert ? tg.showAlert('Не получилось сохранить.') : 0; }
  }
  window.adminDo = adminDo;

  // Пересчёт цен руками. Тот же расчёт, что после игры: стартовая точка —
  // цены из листа «Игроки», поэтому правки тренера не перебиваются, а
  // становятся новой точкой отсчёта. dry=true — только показать.
  async function recalcPrices(sid, dry) {
    const btnText = dry ? 'Считаю…' : 'Пересчитываю…';
    const el = $('adminBody');
    el.insertAdjacentHTML('afterbegin', `<div class="pstat" id="recalcWait">${btnText}</div>`);
    try {
      const r = await api('/fantasy/admin', {method: 'POST', body: JSON.stringify(
        {action: 'prices_recalc', season_id: sid, value: dry ? 1 : 0})});
      renderAdmin(r);
      const res = r.recalc || {};
      const lines = (res.changes || []).slice(0, 20).map(c =>
        `${c.name}: ${c.old} → ${c.new} (${c.rank})`).join('\n');
      const head = (res.changes || []).length
        ? (dry ? `Изменится ${res.changes.length} из ${res.checked}:`
               : `Записано ${res.updated} из ${res.checked}:`)
        : `Проверено ${res.checked || 0} — двигать некого.`;
      const msg = head + (lines ? '\n\n' + lines : '');
      tg && tg.showAlert ? tg.showAlert(msg.slice(0, 380)) : alert(msg);
    } catch (e) {
      tg && tg.showAlert ? tg.showAlert('Пересчёт не прошёл.') : 0;
    } finally {
      const w = $('recalcWait'); if (w) w.remove();
    }
  }
  window.recalcPrices = recalcPrices;

  // JSON внутри onclick='...' : апостроф в названии («Кубок 'A'») закрывал бы
  // атрибут и ломал кнопку. Браузер разворачивает сущности до того, как строку
  // увидит JS, поэтому экранируем тем же esc.
  const jattr = o => esc(JSON.stringify(o));

  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    return b === 1 ? one : many;
  }

  function teamChip(seasonId, t) {
    const act = t.in_pool ? 'pool_remove' : 'pool_add';
    // Убираем по team_id, добавляем целиком (нужны source/comp_id для ростера).
    const val = t.in_pool ? jattr(String(t.team_id)) : jattr(t);
    return `<button class="chip${t.in_pool ? ' on' : ''}" ` +
      `onclick='adminDo({action:"${act}",season_id:${seasonId},value:${val}})'>` +
      `${t.in_pool ? '✅' : '⚪'} ${esc(t.name || (t.source + ':' + t.team_id))}</button>`;
  }

  function playerRow(seasonId, p) {
    const act = jattr({action: 'player_toggle', season_id: seasonId, value: p.ref});
    // У выпавших из заявки вместо имени номер — опознать человека можно только
    // по ссылке на его профиль в лиге, поэтому ссылки показываем всегда.
    const links = (p.profiles || []).map(l =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>`).join(' · ');
    const games = p.games ? `${p.games} ${plural(p.games, 'игра', 'игры', 'игр')}` : 'игр нет';
    return `<div class="card${p.excluded ? ' disabled' : ''}">` +
      `<div class="num">${esc(p.number || '—')}</div>` +
      `<div class="info"><div class="pname">${esc(p.name)}` +
      (p.off_roster ? ' <span class="pteam">(нет в заявке)</span>' : '') +
      (p.excluded ? ' <span class="pteam">(убран)</span>' : '') + `</div>` +
      `<div class="pstat">${esc(p.team || '')} · ${games}</div>` +
      (links ? `<div class="pstat plinks">${links}</div>` : '') + `</div>` +
      `<div class="ctrl"><button class="step wide" onclick='adminDo(${act})'>` +
      `${p.excluded ? 'Вернуть' : 'Убрать'}</button></div></div>`;
  }

  function renderAdmin(d) {
    const el = $('adminBody');
    el.innerHTML = '';
    if (!d.seasons || !d.seasons.length) {
      el.innerHTML = '<div class="banner">Активных лиг нет. Запусти сезон из чат-админки.</div>';
      return;
    }
    const head = document.createElement('div');
    head.className = 'bar';
    head.style.padding = '0 0 8px';
    head.innerHTML = `<button class="chip" onclick="createSeason()">➕ Новый сезон</button>`;
    el.appendChild(head);
    const form = document.createElement('div');
    form.className = 'bar hidden';
    form.id = 'newSeason';
    form.innerHTML =
      `<input id="seasonName" type="text" placeholder="Название, например «Осень 2026»">` +
      `<select id="seasonFormat"><option value="3x3">3×3</option><option value="5x5">5×5</option></select>` +
      `<button class="chip on" onclick="submitSeason()">Создать</button>`;
    el.appendChild(form);
    for (const s of d.seasons) {
      const box = document.createElement('div');
      box.className = 'rank';
      box.style.display = 'block';
      // Снятый турнир должен возвращаться: иначе один промах и очки не
      // считаются, а вернуть нечем.
      const add = (s.can_add || []).map(sc =>
        `<button class="chip" onclick='adminDo({action:"scope_toggle",season_id:${s.id},value:${jattr(sc)}})'>` +
        `+ ${esc(sc.name || sc.source)}</button>`).join(' ');
      // Команды пула: тем же тумблером и добавляем, и убираем — «добавить» без
      // «убрать» уже приводило к тому, что случайно снятую лигу не вернуть.
      const teams = (s.teams || []).map(t => teamChip(s.id, t)).join(' ');
      // Режимы участия: набором. Один включённый — переключателя у игроков нет.
      const md = s.modes || {};
      const modeChips = (s.all_modes || []).map(m =>
        `<button class="chip${(md.modes || []).includes(m.id) ? ' on' : ''}" ` +
        `onclick='adminDo({action:"mode_toggle",season_id:${s.id},value:${jattr(m.id)}})'>` +
        `${(md.modes || []).includes(m.id) ? '✅' : '⚪'} ${esc(m.title)}</button>`).join(' ');
      const excludedCount = (s.players || []).filter(p => p.excluded).length;
      const scopes = (s.scopes || []).map(sc =>
        `<button class="chip on" onclick='adminDo({action:"scope_toggle",season_id:${s.id},value:${jattr(sc)}})'>` +
        `${esc(sc.name || (sc.source + " " + (sc.stage_id || sc.season_id || "")))} ✕</button>`).join(' ');
      box.innerHTML =
        `<div class="pname">${esc(s.name)}</div>` +
        `<div class="pstat">формат ${esc(s.format)} · состав ${s.roster_size} · ` +
        `до ${s.max_per_player} на игрока</div>` +
        `<div class="bar" style="padding-left:0">` +
          `<button class="chip${s.format === '3x3' ? ' on' : ''}" ` +
            `onclick='adminDo({action:"format",season_id:${s.id},value:"3x3"})'>3×3</button>` +
          `<button class="chip${s.format === '5x5' ? ' on' : ''}" ` +
            `onclick='adminDo({action:"format",season_id:${s.id},value:"5x5"})'>5×5</button>` +
          `<button class="chip" onclick='adminDo({action:"max_per",season_id:${s.id},value:1})'>по 1</button>` +
          `<button class="chip" onclick='adminDo({action:"max_per",season_id:${s.id},value:${s.roster_size}})'>без лимита</button>` +
        `</div>` +
        `<div class="pstat">Режимы участия:</div>` +
        `<div class="bar" style="padding-left:0">${modeChips}</div>` +
        ((md.modes || []).includes('budget')
          ? `<div class="bar" style="padding-left:0">` +
            [50, 100, 150].map(v =>
              `<button class="chip${md.budget === v ? ' on' : ''}" ` +
              `onclick='adminDo({action:"budget",season_id:${s.id},value:${v}})'>` +
              `бюджет ${v}</button>`).join(' ') + `</div>` : '') +
        ((md.modes || []).includes('category')
          ? `<div class="bar" style="padding-left:0">` +
            [1.5, 2, 2.5].map(v =>
              `<button class="chip${md.cat_multiplier === v ? ' on' : ''}" ` +
              `onclick='adminDo({action:"multiplier",season_id:${s.id},value:${v}})'>` +
              `коэффициент ×${v}</button>`).join(' ') + `</div>` : '') +
        `<div class="pstat">Движение цен: подъём / падение / шаг</div>` +
        `<div class="bar" style="padding-left:0">` +
          [3, 5].map(v => `<button class="chip${(s.prices || {}).up_games === v ? ' on' : ''}" ` +
            `onclick='adminDo({action:"rank_up_games",season_id:${s.id},value:${v}})'>` +
            `↑ ${v} игр</button>`).join(' ') + ' ' +
          [3, 5].map(v => `<button class="chip${(s.prices || {}).down_games === v ? ' on' : ''}" ` +
            `onclick='adminDo({action:"rank_down_games",season_id:${s.id},value:${v}})'>` +
            `↓ ${v} игр</button>`).join(' ') + ' ' +
          [1, 3, 5].map(v => `<button class="chip${(s.prices || {}).step === v ? ' on' : ''}" ` +
            `onclick='adminDo({action:"price_step",season_id:${s.id},value:${v}})'>` +
            `шаг ${v}</button>`).join(' ') +
        `</div>` +
        `<div class="bar" style="padding-left:0">` +
          `<button class="chip" onclick='recalcPrices(${s.id}, true)'>👀 Показать пересчёт</button> ` +
          `<button class="chip" onclick='recalcPrices(${s.id}, false)'>💰 Пересчитать цены</button>` +
        `</div>` +
        `<div class="pstat">Чьи игроки в пуле${s.manual_pool ? '' : ' (по умолчанию — наши)'}:</div>` +
        `<div class="bar" style="padding-left:0">${teams || '<span class="pstat">команд не найдено</span>'}</div>` +
        `<div class="pstat">Турниры в зачёте${s.manual_scopes ? '' : ' (авто)'}:</div>` +
        `<div class="bar" style="padding-left:0">${scopes || '<span class="pstat">не выбраны — очки не считаются!</span>'}</div>` +
        (add ? `<div class="pstat">Можно добавить:</div><div class="bar" style="padding-left:0">${add}</div>` : '') +
        `<details class="adm-players" data-season="${s.id}"` +
        `${openPlayers.has(s.id) ? ' open' : ''}>` +
        `<summary>Игроки пула: ${(s.players || []).length}` +
        `${excludedCount ? ` · убрано ${excludedCount}` : ''}</summary>` +
        (s.players || []).map(p => playerRow(s.id, p)).join('') + `</details>` +
        `<div class="bar" style="padding-left:0">` +
          `<button class="chip" onclick='confirmFinish(${s.id}, ${jattr(s.name)})'>🏁 Завершить лигу</button>` +
        `</div>`;
      el.appendChild(box);
      const det = box.querySelector('details.adm-players');
      if (det) det.addEventListener('toggle', () => {
        if (det.open) openPlayers.add(s.id); else openPlayers.delete(s.id);
      });
    }
  }

  function createSeason() {
    // В попапе Telegram нет поля ввода, но само приложение — обычная страница:
    // показываем свою строку ввода. Команда боту (/season …) остаётся как
    // запасной путь для тех, у кого живой API недоступен.
    const box = $('newSeason');
    box.classList.toggle('hidden');
    if (!box.classList.contains('hidden')) $('seasonName').focus();
  }

  function submitSeason() {
    const name = ($('seasonName').value || '').trim();
    if (!name) { $('seasonName').focus(); return; }
    const fmt = $('seasonFormat').value || '3x3';
    $('seasonName').value = '';
    $('newSeason').classList.add('hidden');
    adminDo({action: 'start', name: name, format: fmt});
  }
  window.submitSeason = submitSeason;
  window.createSeason = createSeason;

  function confirmFinish(id, name) {
    // Завершение необратимо — спрашиваем, иначе один промах закрывает сезон.
    const ask = 'Завершить лигу «' + name + '»? Набор состава прекратится.';
    if (tg && tg.showConfirm) {
      tg.showConfirm(ask, ok => { if (ok) adminDo({action: 'finish', season_id: id}); });
    } else if (confirm(ask)) {
      adminDo({action: 'finish', season_id: id});
    }
  }
  window.confirmFinish = confirmFinish;

  // ─── топ игроков по фэнтези-очкам ──────────────────────────────────────────

  let topPeriod = 'last';
  const topCache = {};

  async function showTop(period) {
    topPeriod = period;
    haptic('light');
    for (const b of document.querySelectorAll('#topPeriods .chip')) {
      b.classList.toggle('on', b.dataset.period === period);
    }
    if (topCache[period]) { renderTop(topCache[period]); return; }

    // Запасной режим: в payload лежат только суммарные очки за турнир, поэтому
    // честно показываем всё время и не притворяемся, что знаем срезы.
    if (!live) {
      if (period !== 'all') {
        $('topLabel').textContent = '';
        $('topList').innerHTML = '<div class="banner">Срезы по периодам доступны ' +
          'при связи с ботом. Здесь — только «Всё время».</div>';
        return;
      }
      const rows = pool.filter(p => p.st && p.st.games)
        .map(p => ({ref: p.ref, name: p.name, games: p.st.games, fp: p.st.fp,
                    pts: p.st.pts, reb: p.st.reb, ast: p.st.ast}))
        .sort((a, b) => b.fp - a.fp).slice(0, 30);
      // Угадавших офлайн берём из общего зачёта — он и есть «за всё время».
      const guess = (standings || []).map(s => ({name: s.name, points: s.points}));
      renderTop({title: 'за всё время', top: rows, guessers: guess});
      return;
    }

    $('topLabel').textContent = '';
    $('topList').innerHTML = '<div class="banner">Загрузка…</div>';
    try {
      const d = await api('/fantasy/top?period=' + period);
      topCache[period] = d;
      renderTop(d);
    } catch (e) {
      $('topList').innerHTML = '<div class="banner">Не удалось загрузить топ.</div>';
    }
  }
  window.showTop = showTop;

  function medal(i) { return ['🥇','🥈','🥉'][i] || (i + 1) + '.'; }

  // Две таблицы на одном экране не читались: чтобы добраться до участников,
  // приходилось листать через весь список игроков.
  let topTab = 'players';

  function showTopTab(which) {
    topTab = which;
    haptic('light');
    $('ttab-players').classList.toggle('active', which === 'players');
    $('ttab-guess').classList.toggle('active', which === 'guess');
    $('topList').classList.toggle('hidden', which !== 'players');
    $('guessList').classList.toggle('hidden', which !== 'guess');
  }
  window.showTopTab = showTopTab;

  function pickLine(pick) {
    const when = (pick.date || '').slice(8, 10) + '.' + (pick.date || '').slice(5, 7);
    const who = (pick.players || []).map(esc).join(', ') || '—';
    return `<div class="pstat">Игра ${when} · ${pick.points} FP<br>${who}</div>`;
  }

  function renderTop(d) {
    $('topLabel').textContent = d.title ? 'Фэнтези-очки ' + d.title : '';

    const el = $('topList');
    el.innerHTML = '';
    if (!d.top || !d.top.length) {
      el.innerHTML = '<div class="banner">За этот период игр не было.</div>';
    } else {
      d.top.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'rank';
        div.innerHTML = `<div class="place">${medal(i)}</div>` +
          `<div class="info"><div class="pname">${esc(p.name)}<span class="chev">›</span></div>` +
          `<div class="pstat">${games(p.games)} · ${p.pts} очк · ${p.reb} подб · ${p.ast} пас</div></div>` +
          `<div class="pts">${p.fp}</div>`;
        div.onclick = () => openPlayer(p.ref);
        el.appendChild(div);
      });
    }

    const gl = $('guessList');
    gl.innerHTML = '';
    if (!d.guessers || !d.guessers.length) {
      gl.innerHTML = '<div class="banner">За этот период никто не набрал очков.</div>';
      return;
    }
    d.guessers.forEach((g, i) => {
      const picks = g.picks || [];
      const det = document.createElement('details');
      det.className = 'guess';
      det.innerHTML =
        `<summary class="rank"><div class="place">${medal(i)}</div>` +
        `<div class="info"><div class="pname">${esc(g.name || 'Участник')}` +
        (picks.length ? '<span class="chev">▾</span>' : '') + `</div>` +
        (g.games ? `<div class="pstat">${games(g.games)} в зачёте</div>` : '') + `</div>` +
        `<div class="pts">${g.points}</div></summary>` +
        (picks.length
          ? `<div class="guess-body">${picks.map(pickLine).join('')}</div>`
          : '<div class="guess-body"><div class="pstat">Состав не сохранился.</div></div>');
      gl.appendChild(det);
    });
  }

  function togglePlayed() {
    playedOnly = !playedOnly;
    $('playedChip').classList.toggle('on', playedOnly);
    renderPool();
  }
  window.togglePlayed = togglePlayed;

  function renderLeaguePicker() {
    const bar = $('leagueBar'), sel = $('league');
    if (!seasons || seasons.length < 2) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    sel.innerHTML = seasons.map(s =>
      `<option value="${s.id}"${s.id === seasonId ? ' selected' : ''}>${esc(s.name)} · ${esc(s.format)}</option>`
    ).join('');
    sel.onchange = e => switchSeason(parseInt(e.target.value, 10));
  }

  async function switchSeason(id) {
    if (id === seasonId) return;
    haptic('light');
    seasonId = id;
    counts = {};            // состав у каждой лиги свой
    // Топ и правила тоже про конкретную лигу: старое содержимое оставлять
    // нельзя, иначе после переключения человек видит цифры чужого сезона.
    $('topList').innerHTML = '';
    $('guessList').innerHTML = '';
    msg('Загрузка…');
    try { if (!await fromApi()) return; } catch (e) { msg('Не удалось переключить лигу.'); return; }
    msg('');
    renderPool(); renderStandings(); renderRules(); syncButton();
  }

  // ─── старт ─────────────────────────────────────────────────────────────────

  async function init() {
    // Живой режим — если бэкенд доступен. Он даёт свежую статистику и позволяет
    // открывать приложение кнопкой меню (там sendData недоступен).
    let why = '';
    if (!API_LIST.length) why = 'бэкенд не настроен';
    else if (!tg) why = 'вне Telegram';
    else if (!tg.initData) why = 'Telegram не передал подпись';
    else {
      let refusal = null;
      for (const base of API_LIST) {
        API = base;
        try {
          // Первое обращение к спящему туннелю поднимает соединение и бывает
          // медленным, поэтому одна повторная попытка после обрыва по времени.
          let ok;
          try { ok = await fromApi(); }
          catch (e) { if (e.name !== 'AbortError') throw e; ok = await fromApi(); }
          if (!ok) return;
          live = true;
          break;
        } catch (e) {
          // Сервер ответил (e.data) — решение за ним, остальные адреса ведут к
          // тому же серверу. Иначе адрес просто мёртв — пробуем следующий.
          if (e.data) { refusal = e; break; }
        }
      }
      if (!live) {
        // Если бот прислал запасную кнопку с данными (#d=), он уже подтвердил
        // игрока: показываем из payload, даже если живой API ответил «не член»
        // или «не подтверждён» (у части игроков это ложное срабатывание — ник
        // в таблице, спящий туннель). Сохранение всё равно перепроверит сервер
        // по числовому id, так что лишнего не сохранить.
        const hasHash = !!readHashData();
        // Сервер прямо отказал И запасных данных нет: откат не поможет.
        if (!hasHash && refusal && refusal.data.error === 'not_a_member') {
          deadEnd(deniedText()); return;
        }
        if (!hasHash && refusal && refusal.data.error === 'unauthorized') {
          deadEnd('Не удалось подтвердить вход. Открой фэнтези через бота.'); return;
        }
        if (refusal) {
          why = 'сервер ответил: ' + (refusal.data.error || refusal.message);
        } else {
          // Пинг только объясняет неудачу, но не мешает попытке: сделать его
          // шлагбаумом значило бы ронять живой режим на медленной сети.
          why = (await reachable()) ? 'запрос завис, хотя сервер отвечает'
                                    : 'не открывается ' + API.replace(/^https?:\/\//, '');
        }
      }
    }
    if (!live) {
      const D = readHashData();
      if (!D) { deadEnd('Фэнтези сейчас недоступна (' + why + '). Попробуй позже.'); return; }
      if (!D.season) { deadEnd('Сейчас нет активного сезона фэнтези.'); return; }
      fromHash(D);
    }
    if (!pool.length) { deadEnd('Пул игроков пуст — попробуй позже.'); return; }
    $('tab-admin').classList.toggle('hidden', !isAdmin);
    $('lockBanner').classList.toggle('hidden', !locked);
    msg('');
    $('sort').onchange = renderPool;
    $('search').oninput = e => { search = (e.target.value || '').trim().toLowerCase(); renderPool(); };
    renderPool(); renderStandings();
    syncButton();
  }
  init();
})();
</script>
</body>
</html>
