<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Фэнтези</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #fff);
      --text: var(--tg-theme-text-color, #000);
      --hint: var(--tg-theme-hint-color, #999);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #fff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Снизу оставляем место под плашку сохранения (#saveBar) и под «безопасную
       зону» айфона (полоска home indicator). Иначе плашка налезает на
       последние карточки и обрезает их. */
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 16px;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
    header { padding: 14px 16px 6px; }
    h1 { font-size: 18px; margin: 0 0 2px; }
    .sub { color: var(--hint); font-size: 13px; }
    .tabs { display: flex; gap: 8px; padding: 8px 16px; }
    .tab { flex: 1; text-align: center; padding: 9px; border-radius: 10px;
      background: var(--secondary-bg); color: var(--text); font-weight: 600;
      cursor: pointer; border: none; font-size: 15px; }
    .tab.active { background: var(--button); color: var(--button-text); }
    .bar { display: flex; align-items: center; gap: 10px; padding: 4px 16px 8px; }
    .counter { color: var(--hint); font-size: 14px; flex: 1; }
    select { background: var(--secondary-bg); color: var(--text); border: none;
      border-radius: 8px; padding: 7px 8px; font-size: 14px; font-family: inherit; }
    #search { flex: 1; background: var(--secondary-bg); color: var(--text); border: none;
      border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; -webkit-appearance: none; }
    .chip { background: var(--secondary-bg); color: var(--hint); border: none;
      border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap; }
    .chip.on { background: var(--button); color: var(--button-text); }
    /* Четыре периода в один ряд не влезают на узком экране — даём горизонтальную
       прокрутку вместо переноса, чтобы ряд читался как переключатель. */
    #topPeriods { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .list { padding: 0 12px; }
    .card { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--secondary-bg); border-radius: 12px; margin: 8px 0;
      cursor: pointer; border: 2px solid transparent; }
    .card.sel { border-color: var(--button); }
    .card.disabled { opacity: .45; }
    .num { min-width: 34px; height: 34px; border-radius: 8px; background: var(--bg);
      display: flex; align-items: center; justify-content: center; font-weight: 700;
      color: var(--hint); flex-shrink: 0; }
    .card.sel .num { background: var(--button); color: var(--button-text); }
    .info { flex: 1; min-width: 0; }
    .pname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pstat { color: var(--hint); font-size: 12px; margin-top: 2px; }
    .ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .step { width: 30px; height: 30px; border-radius: 8px; border: none; font-size: 18px;
      font-weight: 700; line-height: 1; background: var(--bg); color: var(--button);
      cursor: pointer; padding: 0; }
    .step:disabled { opacity: .3; cursor: default; }
    .step.wide { width: auto; padding: 0 12px; font-size: 14px; }
    .step.del { color: var(--hint); font-size: 15px; }
    .cnt { min-width: 22px; text-align: center; font-weight: 700; }
    .cnt.zero { color: var(--hint); font-weight: 400; }
    .banner { margin: 10px 16px; padding: 12px; border-radius: 10px;
      background: var(--secondary-bg); color: var(--hint); font-size: 14px; text-align: center; }
    .rank { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: var(--secondary-bg); border-radius: 12px; margin: 8px 0; }
    .place { min-width: 30px; font-weight: 700; color: var(--hint); }
    .pts { font-weight: 700; }
    /* Кнопку сохранения рисуем сами, а не нативной MainButton телеграма: та
       живёт в оболочке клиента и на айфоне уезжает за нижний край экрана.
       Своя плашка — часть страницы, её видно всегда. Отступ снизу учитывает
       «безопасную зону» (полоска home indicator). */
    #saveBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg); border-top: 1px solid var(--secondary-bg); }
    #saveBtn { width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--button); color: var(--button-text); font-size: 16px;
      font-weight: 600; font-family: inherit; cursor: pointer; }
    #saveBtn:disabled { opacity: .6; cursor: default; }
    .hidden { display: none; }
    /* pre-line — чтобы в сообщениях работали переносы строк. */
    #msg { text-align: center; color: var(--hint); padding: 40px 16px; white-space: pre-line; }
    .info { cursor: pointer; }
    .chev { color: var(--hint); font-size: 12px; margin-left: 4px; }
    /* Экран игрока */
    /* Экран игрока перекрывает всё (inset: 0), поэтому свою «безопасную зону»
       снизу закладывает сам — иначе журнал игр уползает под home indicator. */
    #player { position: fixed; inset: 0; background: var(--bg); overflow-y: auto;
      padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
    .phead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px; }
    .back { background: none; border: none; color: var(--button); font-size: 16px;
      cursor: pointer; padding: 4px 0; }
    .ptitle { font-size: 19px; font-weight: 700; }
    .warn { margin: 10px 16px; padding: 10px 12px; border-radius: 10px;
      background: var(--secondary-bg); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px; }
    .stat { background: var(--secondary-bg); border-radius: 12px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 19px; }
    .stat span { color: var(--hint); font-size: 12px; }
    .sect { padding: 14px 16px 6px; font-weight: 600; color: var(--hint); font-size: 13px;
      text-transform: uppercase; letter-spacing: .3px; }
    .row { display: flex; justify-content: space-between; padding: 9px 14px; margin: 6px 12px;
      background: var(--secondary-bg); border-radius: 10px; font-size: 14px; }
    .row .d { color: var(--hint); }
  </style>
</head>
<body>
  <header><h1 id="title">🏀 Фэнтези</h1><div class="sub" id="subtitle"></div></header>
  <div class="bar hidden" id="leagueBar">
    <label class="counter" for="league">Лига:</label>
    <select id="league"></select>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-draft" onclick="showTab('draft')">Состав</button>
    <button class="tab" id="tab-table" onclick="showTab('table')">Таблица</button>
    <button class="tab" id="tab-top" onclick="showTab('top')">🔥 Топ</button>
  </div>
  <div id="draft">
    <div class="bar">
      <input id="search" type="search" placeholder="🔎 Поиск по фамилии" autocomplete="off">
    </div>
    <div class="bar">
      <div class="counter" id="counter"></div>
      <button class="chip" id="playedChip" onclick="togglePlayed()">Только с играми</button>
      <select id="sort" aria-label="Сортировка">
        <option value="fp">Фэнтези-очки</option>
        <option value="fp_avg">Очки за игру</option>
        <option value="games">Игры</option>
        <option value="pts">Очки</option>
        <option value="reb">Подборы</option>
        <option value="ast">Передачи</option>
        <option value="stl">Перехваты</option>
        <option value="blk">Блоки</option>
        <option value="name">Имя</option>
      </select>
    </div>
    <div id="lockBanner" class="banner hidden">🔒 Идёт игра — состав заморожен. Менять можно будет сразу после результата.</div>
    <div class="list" id="pool"></div>
    <div id="poolEmpty" class="banner hidden">Никого не нашлось по фильтру.</div>
  </div>
  <div id="table" class="hidden">
    <div class="bar"><div class="counter" id="weekLabel"></div></div>
    <div class="list" id="standings"></div>
  </div>
  <div id="top" class="hidden">
    <div class="bar" id="topPeriods">
      <button class="chip on" data-period="last" onclick="showTop('last')">Последняя игра</button>
      <button class="chip" data-period="week" onclick="showTop('week')">Неделя</button>
      <button class="chip" data-period="month" onclick="showTop('month')">Месяц</button>
      <button class="chip" data-period="all" onclick="showTop('all')">Всё время</button>
    </div>
    <div class="bar"><div class="counter" id="topLabel"></div></div>
    <div class="list" id="topList"></div>
  </div>
  <div id="player" class="hidden">
    <div class="phead">
      <button class="back" onclick="closePlayer()">‹ Назад</button>
      <div class="ptitle" id="pTitle"></div>
    </div>
    <div class="sub" style="padding: 0 16px 6px" id="pSub"></div>
    <div class="tabs">
      <button class="tab active" id="ptab-last" onclick="showSlice('last')">Последняя игра</button>
      <button class="tab" id="ptab-season" onclick="showSlice('season')">Весь турнир</button>
    </div>
    <div id="pBody"></div>
  </div>

  <div id="saveBar" class="hidden">
    <button id="saveBtn" onclick="saveRoster()">Сохранить состав</button>
  </div>

  <div id="msg">Загрузка…</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Живой бэкенд: адрес может прийти в ссылке (?api=… — Cloudflare quick-tunnel,
  // он меняется при каждом рестарте), запасной — Tailscale Funnel. Пробуем их
  // ПО ОЧЕРЕДИ: ссылку Telegram кеширует (кнопка меню, старая reply-кнопка), так
  // что адрес в ней легко оказывается мёртвым, и упираться в него, имея рабочий
  // Funnel, нельзя. Если сервер ОТВЕТИЛ (пусть отказом) — перебор прекращаем:
  // адреса ведут к одному серверу, его решение от смены адреса не изменится.
  // Не достучались никуда — приложение уйдёт в запасной режим по #d=.
  const FUNNEL = 'https://botpc.tail5ed4ef.ts.net';
  const API_LIST = [...new Set([
    (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, ''),
    FUNNEL,
  ])].filter(Boolean);
  let API = API_LIST[0] || '';

  let live = false, rosterSize = 3, maxPer = 3, locked = false;
  let pool = [], counts = {}, standings = [], weekStart = '';
  let search = '', playedOnly = false, isAdmin = false;
  let seasonId = null, seasons = [];

  const $ = id => document.getElementById(id);
  function msg(t){ const m=$('msg'); m.textContent=t; m.classList.toggle('hidden', !t); }

  // Тупиковый экран: кроме сообщения показывать нечего. Вкладки и фильтры
  // прячем — рабочий вид приложения над текстом ошибки только сбивает с толку.
  function deadEnd(text) {
    for (const el of [$('leagueBar'), document.querySelector('.tabs'),
                      $('draft'), $('table'), $('top'), $('saveBar')]) {
      if (el) el.classList.add('hidden');
    }
    msg(text);
  }

  // Отказ в доступе объясняем с ником, который видит бот: причина почти всегда
  // в том, что он не совпадает с ником в таблице команды, и увидеть свой ник
  // прямо в сообщении быстрее, чем выяснять это перепиской с админом.
  function deniedText() {
    let u = '';
    try { u = tg.initDataUnsafe.user.username || ''; } catch (e) {}
    return '🚫 У тебя нет доступа к фэнтези.\n\n' +
      'Она открыта только игрокам команды из состава.\n\n' +
      (u ? `Бот видит тебя как @${u}.\n\n` : '') +
      'Если ты в составе — попроси администратора сверить твой ник в таблице команды.';
  }
  function haptic(t){ try{ tg.HapticFeedback.impactOccurred(t); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const total = () => Object.values(counts).reduce((a,b)=>a+b, 0);

  // ─── источники данных ──────────────────────────────────────────────────────

  // Быстрая проверка достижимости: без неё недоступный бэкенд заставлял ждать
  // полный таймаут, а причину («не доходит» или «отвечает, но отказывает»)
  // было не отличить.
  // Намеренно без заголовка X-Init-Data: это «простой» запрос, браузер не шлёт
  // предзапрос. Провал здесь означает именно сеть или DNS, а не CORS.
  async function reachable() {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 5000);
    try { await fetch(API + '/health', {signal: ctl.signal}); return true; }
    catch (e) { return false; }
    finally { clearTimeout(timer); }
  }

  async function api(path, opts, timeoutMs) {
    // Выбранную лигу подмешиваем во ВСЕ вызовы — бэкенд считает по ней.
    if (seasonId) path += (path.indexOf('?') >= 0 ? '&' : '?') + 'season=' + encodeURIComponent(seasonId);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs || 15000);  // мобильная сеть бывает медленной
    try {
      const r = await fetch(API + path, Object.assign({
        signal: ctl.signal,
        headers: Object.assign({'X-Init-Data': (tg && tg.initData) || ''},
                               (opts && opts.body) ? {'Content-Type':'application/json'} : {}),
      }, opts || {}));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { const e = new Error('HTTP ' + r.status); e.data = data; throw e; }
      return data;
    } finally { clearTimeout(timer); }
  }

  // Запасной режим: бот кладёт данные в URL — #d=base64url(JSON).
  function readHashData() {
    const m = (location.hash || '').match(/[#&]d=([^&]+)/);
    if (!m) return null;
    try {
      let b = m[1].replace(/-/g,'+').replace(/_/g,'/');
      while (b.length % 4) b += '=';
      const bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (e) { return null; }
  }

  const ZERO = {games:0,pts:0,reb:0,ast:0,stl:0,blk:0,tur:0,fp:0,fp_avg:0};

  // Приводим оба формата к одному виду. В запасном режиме ключи сокращены,
  // чтобы URL Mini App не разрастался.
  function fromHash(D) {
    rosterSize = D.season.roster_size || 3;
    maxPer = D.season.max_per_player || rosterSize;
    locked = !!D.locked;
    weekStart = D.week_start || '';
    standings = D.standings || [];
    pool = (D.pool || []).map(p => {
      const s = p.s || {};
      return { ref: p.r, name: p.m || p.r, number: '', team: '',
        st: {games:s.g||0, pts:s.p||0, reb:s.rb||0, ast:s.a||0,
             stl:s.s||0, blk:s.b||0, tur:s.t||0, fp:s.f||0,
             fp_avg: s.g ? Math.round((s.f||0)/s.g*10)/10 : 0},
        last: {fp: s.lf, date: s.ld} };
    });
    for (const r of (D.roster || [])) counts[r] = (counts[r] || 0) + 1;
    $('subtitle').textContent = D.season.name + ' · формат ' + D.season.format;
  }

  async function fromApi() {
    const [p, r, s] = await Promise.all([
      api('/fantasy/pool'), api('/fantasy/roster'), api('/fantasy/standings'),
    ]);
    if (!p.season) { msg('Сейчас нет активного сезона фэнтези.'); return false; }
    if (!p.member) { msg('Фэнтези доступна только игрокам команды.'); return false; }
    seasons = p.seasons || [];
    if (!seasonId) seasonId = p.season.id;   // первый ответ фиксирует лигу
    renderLeaguePicker();
    rosterSize = p.season.roster_size || 3;
    maxPer = p.season.max_per_player || rosterSize;
    isAdmin = !!p.admin;
    locked = !!r.locked;
    weekStart = r.week_start || s.week_start || '';
    standings = s.standings || [];
    pool = (p.pool || []).map(x => ({
      ref: x.ref, name: x.name || x.ref, number: x.number || '', team: x.team || '',
      st: Object.assign({}, ZERO, x.stats || {}),
      last: {fp: (x.last||{}).fp, date: (x.last||{}).date},
      excluded: !!x.excluded,
    }));
    for (const ref of (r.roster || [])) counts[ref] = (counts[ref] || 0) + 1;
    $('subtitle').textContent = p.season.name + ' · формат ' + p.season.format;
    return true;
  }

  // ─── отрисовка ─────────────────────────────────────────────────────────────

  function sortPool() {
    const key = $('sort').value;
    pool.sort((a, b) => key === 'name'
      ? a.name.localeCompare(b.name, 'ru')
      : (b.st[key] || 0) - (a.st[key] || 0) || a.name.localeCompare(b.name, 'ru'));
  }

  // Под фамилией — очки за последнюю игру + подсказка тапнуть за подробностями.
  function statLine(p) {
    if (!p.st.games) return 'нет сыгранных игр';
    const lf = p.last && p.last.fp;
    const head = (lf === null || lf === undefined)
      ? `${p.st.games} игр · ${p.st.fp} FP`
      : `Посл. игра: ${lf} FP`;
    return live ? `${head} · нажми для деталей ›` : head;
  }

  function passesFilter(p) {
    // Убранных админом показываем только админу (чтобы вернуть); остальным — нет.
    if (p.excluded && !isAdmin) return false;
    // Выбранных всегда показываем, чтобы не терять свой состав из виду.
    if (counts[p.ref]) return true;
    if (search && p.name.toLowerCase().indexOf(search) < 0) return false;
    if (playedOnly && !(p.st && p.st.games)) return false;
    return true;
  }

  async function toggleExclude(ref) {
    if (!live) return;
    haptic('medium');
    try {
      const res = await api('/fantasy/exclude', { method: 'POST', body: JSON.stringify({ ref }) });
      const p = pool.find(x => x.ref === ref);
      if (p) p.excluded = !!res.excluded;
      renderPool();
    } catch (e) {
      tg && tg.showAlert ? tg.showAlert('Не удалось изменить пул.') : 0;
    }
  }
  window.toggleExclude = toggleExclude;

  function renderPool() {
    sortPool();
    const el = $('pool'); el.innerHTML = '';
    const full = total() >= rosterSize;
    const visible = pool.filter(passesFilter);
    $('poolEmpty').classList.toggle('hidden', visible.length > 0);
    for (const p of visible) {
      const n = counts[p.ref] || 0;
      const canAdd = !locked && !full && n < maxPer && !p.excluded;
      const c = document.createElement('div');
      c.className = 'card' + (n ? ' sel' : '') + ((locked || p.excluded || (!n && full)) ? ' disabled' : '');
      const ctrl = p.excluded
        ? (isAdmin ? `<button class="step wide" data-act="restore">Вернуть</button>` : '')
        : `<button class="step" data-act="dec" ${(!n || locked) ? 'disabled' : ''}>−</button>` +
          `<span class="cnt${n ? '' : ' zero'}">${n}</span>` +
          `<button class="step" data-act="inc" ${canAdd ? '' : 'disabled'}>+</button>` +
          (isAdmin ? `<button class="step del" data-act="remove" title="Убрать из пула">✕</button>` : '');
      c.innerHTML =
        `<div class="num">${esc(p.number || '—')}</div>` +
        `<div class="info"><div class="pname">${esc(p.name)}` +
        (p.excluded ? ' <span class="pteam">(убран)</span>' : (live ? '<span class="chev">›</span>' : '')) + `</div>` +
        `<div class="pstat">${esc(statLine(p))}</div></div>` +
        `<div class="ctrl">${ctrl}</div>`;
      const inc = c.querySelector('[data-act=inc]'); if (inc) inc.onclick = e => { e.stopPropagation(); bump(p.ref, +1); };
      const dec = c.querySelector('[data-act=dec]'); if (dec) dec.onclick = e => { e.stopPropagation(); bump(p.ref, -1); };
      const rm = c.querySelector('[data-act=remove]'); if (rm) rm.onclick = e => { e.stopPropagation(); toggleExclude(p.ref); };
      const rs = c.querySelector('[data-act=restore]'); if (rs) rs.onclick = e => { e.stopPropagation(); toggleExclude(p.ref); };
      // Тап по имени — профиль игрока (у исключённых тоже можно посмотреть).
      c.querySelector('.info').onclick = () => { if (!p.excluded) openPlayer(p.ref); };
      el.appendChild(c);
    }
    updateCounter();
  }

  function bump(ref, delta) {
    const n = counts[ref] || 0;
    if (delta > 0) {
      if (locked || total() >= rosterSize || n >= maxPer) return;
      counts[ref] = n + 1; haptic('medium');
    } else {
      if (locked || !n) return;
      if (n === 1) delete counts[ref]; else counts[ref] = n - 1;
      haptic('light');
    }
    renderPool(); syncButton();
  }

  function updateCounter() {
    const hint = maxPer < rosterSize ? ` · до ${maxPer} на игрока` : '';
    $('counter').textContent = `Выбрано: ${total()} / ${rosterSize}${hint}`;
  }

  // Плашку показываем только на вкладке состава и только когда набран полный
  // ростер — на «Таблице» и на экране игрока сохранять нечего.
  function syncButton() {
    const onDraft = !$('draft').classList.contains('hidden');
    const ready = onDraft && !locked && total() === rosterSize;
    $('saveBar').classList.toggle('hidden', !ready);
  }

  // Состав как плоский список с повторами — порядок пула, чтобы был стабилен.
  function selectedRefs() {
    const out = [];
    for (const p of pool) for (let i = 0; i < (counts[p.ref] || 0); i++) out.push(p.ref);
    return out;
  }

  const SAVE_ERRORS = {
    invalid_roster: 'Неверное число игроков.',
    unknown_player: 'В составе есть игрок не из пула.',
    too_many_copies: 'Слишком много копий одного игрока.',
    locked: 'Идёт игра — состав заморожен. Менять можно будет сразу после результата.',
    not_a_member: 'У тебя нет доступа к фэнтези — она только для игроков команды.',
  };

  async function saveRoster() {
    haptic('heavy');
    const refs = selectedRefs();
    if (!live) { tg.sendData(JSON.stringify({ refs })); return; }  // Telegram сам закроет
    const btn = $('saveBtn');
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    try {
      await api('/fantasy/roster', { method: 'POST', body: JSON.stringify({ refs }) });
      tg.showPopup ? tg.showPopup({title:'Готово', message:'Состав сохранён! Удачи в туре 🏀',
                                   buttons:[{type:'close'}]}, () => tg.close())
                   : tg.close();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Сохранить состав';
      const text = (e.data && SAVE_ERRORS[e.data.error]) || 'Не удалось сохранить. Попробуй ещё раз.';
      tg.showAlert ? tg.showAlert(text) : alert(text);
    }
  }
  window.saveRoster = saveRoster;

  // ─── экран игрока ──────────────────────────────────────────────────────────

  let P = null, slice = 'last';

  async function openPlayer(ref) {
    if (!live) { tg && tg.showAlert ? tg.showAlert('Статистика игрока доступна только при связи с ботом.') : 0; return; }
    haptic('light');
    $('player').classList.remove('hidden');
    $('pTitle').textContent = 'Загрузка…';
    $('pSub').textContent = '';
    $('pBody').innerHTML = '';
    $('saveBar').classList.add('hidden');
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closePlayer); }
    try {
      P = await api('/fantasy/player?ref=' + encodeURIComponent(ref));
    } catch (e) {
      $('pTitle').textContent = 'Не удалось загрузить';
      return;
    }
    slice = 'last';
    renderPlayer();
  }

  function closePlayer() {
    $('player').classList.add('hidden');
    if (tg && tg.BackButton) tg.BackButton.hide();
    syncButton();
  }
  window.closePlayer = closePlayer;

  function showSlice(name) {
    slice = name;
    $('ptab-last').classList.toggle('active', name === 'last');
    $('ptab-season').classList.toggle('active', name === 'season');
    renderPlayer();
  }
  window.showSlice = showSlice;

  function statCard(value, label) {
    return `<div class="stat"><b>${value}</b><span>${label}</span></div>`;
  }

  // «5 игр» / «2 игры» / «1 игра» — иначе текст выглядит машинным.
  function games(n) {
    const t = Math.abs(n) % 100, o = t % 10;
    if (t > 10 && t < 20) return n + ' игр';
    if (o === 1) return n + ' игра';
    if (o >= 2 && o <= 4) return n + ' игры';
    return n + ' игр';
  }

  function renderPlayer() {
    const s = P.season;
    $('pTitle').textContent = (P.number ? '№' + P.number + ' ' : '') + P.name;
    $('pSub').textContent = P.tournament || '';
    const b = $('pBody');

    // Посещаемость и пропуски показываем в обоих срезах: без них непонятно,
    // за сколько матчей набраны очки.
    let html = `<div class="warn">Сыграл <b>${s.games}</b> из ${games(s.team_games)} команды` +
      (s.missed_streak ? ` · пропустил ${games(s.missed_streak)} подряд` : '') + `</div>`;

    if (slice === 'last') {
      const l = P.last;
      if (!l) {
        html += '<div class="banner">В этом турнире ещё не играл</div>';
      } else {
        html += `<div class="sect">${l.game_date} · ${l.home ? 'дома' : 'в гостях'} с ` +
          `${esc(l.opponent || 'соперником')} · ${l.our_score}:${l.their_score}</div>` +
          '<div class="grid">' +
          statCard(l.fp, 'фэнтези-очки') + statCard(l.pts, 'очки') + statCard(l.reb, 'подборы') +
          statCard(l.ast, 'передачи') + statCard(l.stl, 'перехваты') + statCard(l.blk, 'блоки') +
          statCard(l.tur, 'потери') + statCard(l.fgm + '/' + l.fga, 'броски') +
          statCard(l.tpm + '/' + l.tpa, 'трёхочковые') +
          '</div>';
      }
    } else {
      const a = s.avg, pct = v => v === null || v === undefined ? '—' : v + '%';
      html += '<div class="grid">' +
        statCard(s.fp, 'фэнтези-очки') + statCard(s.fp_avg, 'FP за игру') + statCard(s.games, 'сыграно') +
        '</div><div class="sect">В среднем за игру</div><div class="grid">' +
        statCard(a.pts ?? 0, 'очки') + statCard(a.reb ?? 0, 'подборы') + statCard(a.ast ?? 0, 'передачи') +
        statCard(a.stl ?? 0, 'перехваты') + statCard(a.blk ?? 0, 'блоки') + statCard(a.tur ?? 0, 'потери') +
        '</div><div class="sect">Реализация</div><div class="grid">' +
        statCard(pct(s.fg_pct), 'с игры') + statCard(pct(s.tp_pct), 'трёхочковые') +
        statCard(pct(s.ft_pct), 'штрафные') +
        '</div>';
    }

    if (P.log && P.log.length) {
      html += '<div class="sect">Последние игры</div>';
      for (const g of P.log) {
        html += `<div class="row"><span class="d">${g.game_date}</span>` +
          `<span>${g.pts} очк · ${g.reb} подб · ${g.ast} пас</span>` +
          `<b>${g.fp}</b></div>`;
      }
    }
    b.innerHTML = html;
  }

  let openRank = -1;   // раскрытая история участника
  function renderStandings() {
    const el = $('standings'); el.innerHTML = '';
    $('weekLabel').textContent = 'Общий зачёт лиги';
    if (!standings.length) { el.innerHTML = '<div class="banner">Пока нет очков</div>'; return; }
    standings.forEach((row, i) => {
      const medal = ['🥇','🥈','🥉'][i] || (i + 1) + '.';
      const div = document.createElement('div'); div.className = 'rank';
      div.innerHTML = `<div class="place">${medal}</div>` +
        `<div class="info"><div class="pname">${esc(row.name || 'Участник')}` +
        ((row.history && row.history.length) ? '<span class="chev">›</span>' : '') + `</div></div>` +
        `<div class="pts">${row.points}</div>`;
      div.onclick = () => { openRank = (openRank === i ? -1 : i); renderStandings(); };
      el.appendChild(div);
      // История по турам — раскрывается под участником.
      if (openRank === i && row.history && row.history.length) {
        for (const h of row.history.slice().reverse()) {
          const hr = document.createElement('div'); hr.className = 'row';
          hr.innerHTML = `<span class="d">${esc(h.label || ('Тур с ' + h.week))}</span><b>${h.points}</b>`;
          el.appendChild(hr);
        }
      }
    });
  }

  function showTab(name) {
    for (const t of ['draft', 'table', 'top']) {
      $(t).classList.toggle('hidden', name !== t);
      $('tab-' + t).classList.toggle('active', name === t);
    }
    syncButton();
    if (name === 'top' && !$('topList').children.length) showTop(topPeriod);
  }
  window.showTab = showTab;

  // ─── топ игроков по фэнтези-очкам ──────────────────────────────────────────

  let topPeriod = 'last';
  const topCache = {};

  async function showTop(period) {
    topPeriod = period;
    haptic('light');
    for (const b of document.querySelectorAll('#topPeriods .chip')) {
      b.classList.toggle('on', b.dataset.period === period);
    }
    if (topCache[period]) { renderTop(topCache[period]); return; }

    // Запасной режим: в payload лежат только суммарные очки за турнир, поэтому
    // честно показываем всё время и не притворяемся, что знаем срезы.
    if (!live) {
      if (period !== 'all') {
        $('topLabel').textContent = '';
        $('topList').innerHTML = '<div class="banner">Срезы по периодам доступны ' +
          'при связи с ботом. Здесь — только «Всё время».</div>';
        return;
      }
      const rows = pool.filter(p => p.st && p.st.games)
        .map(p => ({ref: p.ref, name: p.name, games: p.st.games, fp: p.st.fp,
                    pts: p.st.pts, reb: p.st.reb, ast: p.st.ast}))
        .sort((a, b) => b.fp - a.fp).slice(0, 30);
      renderTop({title: 'за всё время', top: rows});
      return;
    }

    $('topLabel').textContent = '';
    $('topList').innerHTML = '<div class="banner">Загрузка…</div>';
    try {
      const d = await api('/fantasy/top?period=' + period);
      topCache[period] = d;
      renderTop(d);
    } catch (e) {
      $('topList').innerHTML = '<div class="banner">Не удалось загрузить топ.</div>';
    }
  }
  window.showTop = showTop;

  function renderTop(d) {
    $('topLabel').textContent = d.title ? 'Фэнтези-очки ' + d.title : '';
    const el = $('topList');
    el.innerHTML = '';
    if (!d.top || !d.top.length) {
      el.innerHTML = '<div class="banner">За этот период игр не было.</div>';
      return;
    }
    d.top.forEach((p, i) => {
      const medal = ['🥇','🥈','🥉'][i] || (i + 1) + '.';
      const div = document.createElement('div');
      div.className = 'rank';
      div.innerHTML = `<div class="place">${medal}</div>` +
        `<div class="info"><div class="pname">${esc(p.name)}<span class="chev">›</span></div>` +
        `<div class="pstat">${games(p.games)} · ${p.pts} очк · ${p.reb} подб · ${p.ast} пас</div></div>` +
        `<div class="pts">${p.fp}</div>`;
      div.onclick = () => openPlayer(p.ref);
      el.appendChild(div);
    });
  }

  function togglePlayed() {
    playedOnly = !playedOnly;
    $('playedChip').classList.toggle('on', playedOnly);
    renderPool();
  }
  window.togglePlayed = togglePlayed;

  function renderLeaguePicker() {
    const bar = $('leagueBar'), sel = $('league');
    if (!seasons || seasons.length < 2) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    sel.innerHTML = seasons.map(s =>
      `<option value="${s.id}"${s.id === seasonId ? ' selected' : ''}>${esc(s.name)} · ${esc(s.format)}</option>`
    ).join('');
    sel.onchange = e => switchSeason(parseInt(e.target.value, 10));
  }

  async function switchSeason(id) {
    if (id === seasonId) return;
    haptic('light');
    seasonId = id;
    counts = {};            // состав у каждой лиги свой
    msg('Загрузка…');
    try { if (!await fromApi()) return; } catch (e) { msg('Не удалось переключить лигу.'); return; }
    msg('');
    renderPool(); renderStandings(); syncButton();
  }

  // ─── старт ─────────────────────────────────────────────────────────────────

  async function init() {
    // Живой режим — если бэкенд доступен. Он даёт свежую статистику и позволяет
    // открывать приложение кнопкой меню (там sendData недоступен).
    let why = '';
    if (!API_LIST.length) why = 'бэкенд не настроен';
    else if (!tg) why = 'вне Telegram';
    else if (!tg.initData) why = 'Telegram не передал подпись';
    else {
      let refusal = null;
      for (const base of API_LIST) {
        API = base;
        try {
          // Первое обращение к спящему туннелю поднимает соединение и бывает
          // медленным, поэтому одна повторная попытка после обрыва по времени.
          let ok;
          try { ok = await fromApi(); }
          catch (e) { if (e.name !== 'AbortError') throw e; ok = await fromApi(); }
          if (!ok) return;
          live = true;
          break;
        } catch (e) {
          // Сервер ответил (e.data) — решение за ним, остальные адреса ведут к
          // тому же серверу. Иначе адрес просто мёртв — пробуем следующий.
          if (e.data) { refusal = e; break; }
        }
      }
      if (!live) {
        // Если бот прислал запасную кнопку с данными (#d=), он уже подтвердил
        // игрока: показываем из payload, даже если живой API ответил «не член»
        // или «не подтверждён» (у части игроков это ложное срабатывание — ник
        // в таблице, спящий туннель). Сохранение всё равно перепроверит сервер
        // по числовому id, так что лишнего не сохранить.
        const hasHash = !!readHashData();
        // Сервер прямо отказал И запасных данных нет: откат не поможет.
        if (!hasHash && refusal && refusal.data.error === 'not_a_member') {
          deadEnd(deniedText()); return;
        }
        if (!hasHash && refusal && refusal.data.error === 'unauthorized') {
          deadEnd('Не удалось подтвердить вход. Открой фэнтези через бота.'); return;
        }
        if (refusal) {
          why = 'сервер ответил: ' + (refusal.data.error || refusal.message);
        } else {
          // Пинг только объясняет неудачу, но не мешает попытке: сделать его
          // шлагбаумом значило бы ронять живой режим на медленной сети.
          why = (await reachable()) ? 'запрос завис, хотя сервер отвечает'
                                    : 'не открывается ' + API.replace(/^https?:\/\//, '');
        }
      }
    }
    if (!live) {
      const D = readHashData();
      if (!D) { deadEnd('Фэнтези сейчас недоступна (' + why + '). Попробуй позже.'); return; }
      if (!D.season) { deadEnd('Сейчас нет активного сезона фэнтези.'); return; }
      fromHash(D);
    }
    if (!pool.length) { deadEnd('Пул игроков пуст — попробуй позже.'); return; }
    $('lockBanner').classList.toggle('hidden', !locked);
    msg('');
    $('sort').onchange = renderPool;
    $('search').oninput = e => { search = (e.target.value || '').trim().toLowerCase(); renderPool(); };
    renderPool(); renderStandings();
    syncButton();
  }
  init();
})();
</script>
</body>
</html>
