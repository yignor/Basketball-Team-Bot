# Ставится в /etc/systemd/journald.conf.d/10-limit.conf
#
# Главный пожиратель места среди логов — не файлы в /var/log, а сам журнал
# systemd: на 12.08.2026 он занимал 323 МБ, а потолок стоял по умолчанию, то
# есть до 10% раздела с ограничением в 4 ГБ. Диск на 98 ГБ такое переживёт, но
# «переживёт» — не то же самое, что «под контролем».
#
# 500 МБ хватает примерно на месяц истории при нынешней болтливости, а это
# больше, чем нужно для разбора любого происшествия: до сих пор все разборы
# укладывались в неделю.
[Journal]
SystemMaxUse=500M
SystemMaxFileSize=50M
